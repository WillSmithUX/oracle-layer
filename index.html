<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Oracle Layer</title>
<style>
  :root {
    --color-bg: #05070b;
    --color-panel: #0b0f17;
    --color-panel-alt: #10151f;
    --color-border: #1d2531;
    --color-text: #e8ebf0;
    --color-text-dim: #8b95a7;
    --color-mint: #4de8b0;
    --color-mint-dim: rgba(77, 232, 176, 0.15);
    --color-mint-glow: rgba(77, 232, 176, 0.45);
    --color-amber: #e8b64d;
    --color-gray: #5a6472;
    --color-danger: #d9695f;
    --color-danger-dim: rgba(217, 105, 95, 0.12);
    --color-student: #141b27;
    --color-hold-fill: rgba(255, 255, 255, 0.18);
    --color-debug: #1a1330;
    --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --radius: 4px;
    /* Timing values below are set from the TIMING object at boot. */
    --t-slide: 300ms;
    --t-hold: 700ms;
    --t-meter: 600ms;
    --t-tint: 1200ms;
    --t-glyph-idle: 4000ms;
    --t-glyph-draft: 1100ms;
    --t-glyph-flash: 900ms;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }

  html, body {
    height: 100%;
    margin: 0;
    background: var(--color-bg);
    color: var(--color-text);
    font-family: var(--font-sans);
  }

  .app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    min-width: 320px;
  }

  /* ---------- Header ---------- */
  .app-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    border-bottom: 1px solid var(--color-border);
    background: var(--color-panel);
    flex: 0 0 auto;
  }

  .brand { display: flex; align-items: baseline; gap: 16px; }
  .brand-title { font-size: 15px; font-weight: 700; letter-spacing: 0.06em; }
  .brand-meta {
    display: flex; gap: 12px;
    font-family: var(--font-mono); font-size: 12px; color: var(--color-text-dim);
  }

  /* Oracle's glyph. --glyph-color and --glyph-scale carry the relationship
     tint (PLAN.md §4); state classes carry the moment-to-moment behaviour. */
  .oracle-glyph {
    display: flex; align-items: center; gap: 10px;
    --glyph-color: var(--color-mint);
    --glyph-scale: 1;
  }
  .header-right { display: flex; align-items: center; gap: 22px; }
  .link-btn {
    background: none; border: none; padding: 4px 2px; cursor: pointer;
    font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--color-text-dim); border-bottom: 1px solid transparent;
  }
  .link-btn:hover { color: var(--color-text); border-bottom-color: var(--color-border); }
  .link-btn:focus-visible { outline: 2px solid var(--color-mint); outline-offset: 2px; }
  .oracle-glyph.tint-pleased { --glyph-color: var(--color-amber); --glyph-scale: 1.1; }
  .oracle-glyph.tint-cool { --glyph-color: var(--color-gray); --glyph-scale: 0.88; }
  .glyph-label {
    font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.08em;
    color: var(--color-text-dim);
  }
  .glyph-confidence {
    font-family: var(--font-mono); font-size: 13px; color: var(--glyph-color);
    min-width: 3.2ch; text-align: right; transition: color var(--t-tint) ease;
  }
  .glyph-confidence:empty { display: none; }

  .glyph-ring {
    transform: scale(var(--glyph-scale));
    transition: transform var(--t-tint) ease, filter 300ms ease;
  }
  .glyph-ring-track { fill: none; stroke: var(--color-border); stroke-width: 2; }
  .glyph-ring-fill {
    fill: none; stroke: var(--glyph-color); stroke-width: 2; stroke-linecap: round;
    animation: glyph-idle var(--t-glyph-idle) ease-in-out infinite;
    transition: stroke var(--t-tint) ease;
  }
  .glyph-ring-conf {
    fill: none; stroke: var(--glyph-color); stroke-width: 1.5; stroke-linecap: round;
    transform: rotate(-90deg); transform-origin: center;
    transition: stroke-dasharray 200ms linear, stroke var(--t-tint) ease;
    opacity: 0.9;
  }
  @keyframes glyph-idle {
    0%, 100% { opacity: 0.35; stroke-width: 2; }
    50% { opacity: 0.9; stroke-width: 3; }
  }
  /* drafting: faster, tighter pulse */
  .oracle-glyph.is-drafting .glyph-ring-fill {
    animation: glyph-drafting var(--t-glyph-draft) ease-in-out infinite;
  }
  @keyframes glyph-drafting {
    0%, 100% { opacity: 0.55; stroke-width: 2; }
    50% { opacity: 1; stroke-width: 2.5; }
  }
  /* speaking: brief flare when a margin line appears */
  .oracle-glyph.is-speaking .glyph-ring { filter: drop-shadow(0 0 6px var(--glyph-color)) brightness(1.3); }
  /* released: brightens once */
  .oracle-glyph.is-released .glyph-ring { animation: glyph-flare var(--t-glyph-flash) ease-out 1; }
  @keyframes glyph-flare {
    0% { filter: brightness(1); }
    30% { filter: drop-shadow(0 0 10px var(--glyph-color)) brightness(1.8); }
    100% { filter: brightness(1); }
  }
  /* held / blocked / escalated: dims once */
  .oracle-glyph.is-held .glyph-ring { animation: glyph-dim var(--t-glyph-flash) ease-out 1; }
  @keyframes glyph-dim {
    0% { opacity: 1; }
    30% { opacity: 0.25; transform: scale(calc(var(--glyph-scale) * 0.92)); }
    100% { opacity: 1; }
  }

  /* ---------- Console layout ---------- */
  .console {
    flex: 1 1 auto;
    display: grid;
    grid-template-columns: 216px 1fr 300px;
    min-height: 0;
  }
  .panel { padding: 16px; overflow-y: auto; min-height: 0; min-width: 0; }
  .panel-queue { background: var(--color-panel); border-right: 1px solid var(--color-border); }
  .panel-thread { background: var(--color-bg); display: flex; flex-direction: column; overflow: hidden; }
  .panel-side {
    background: var(--color-panel); border-left: 1px solid var(--color-border);
    display: flex; flex-direction: column; gap: 24px;
  }

  .panel-title {
    margin: 0 0 12px;
    font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--color-text-dim);
  }

  /* ---------- Queue ---------- */
  .queue-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
  .queue-item {
    display: flex; align-items: center; flex-wrap: wrap; gap: 4px 8px; padding: 8px;
    border-radius: var(--radius); font-size: 13px; color: var(--color-text-dim);
  }
  .queue-item.is-new { animation: slide-in var(--t-slide) ease-out both; }
  .queue-item.is-active { background: var(--color-mint-dim); color: var(--color-text); }
  .queue-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--color-gray); flex: 0 0 auto; }
  .queue-item.is-active .queue-dot { background: var(--color-mint); }
  .queue-item.is-released .queue-dot { background: var(--color-mint); opacity: 0.5; }
  .queue-item.is-held .queue-dot { background: var(--color-amber); opacity: 0.7; }
  .queue-name { flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .queue-time { font-family: var(--font-mono); font-size: 10px; color: var(--color-text-dim); white-space: nowrap; }
  .queue-status {
    font-family: var(--font-mono); font-size: 10px; text-transform: uppercase;
    color: var(--color-text-dim); white-space: nowrap;
  }

  /* ---------- Thread ---------- */
  /* The thread takes whatever height the dock leaves, but never less than
     its floor; the dock is content-sized and only scrolls if it alone
     outgrows the panel. Basis 0 (not auto) so a long thread can't push the
     dock out. Vertical scroll only. */
  .thread-messages {
    flex: 1 1 0; min-height: 96px; min-width: 0;
    overflow-y: auto; overflow-x: hidden;
    display: flex; flex-direction: column; gap: 14px; padding-right: 6px; padding-bottom: 8px;
  }
  .thread-empty {
    flex: 1 1 auto; display: flex; align-items: center; justify-content: center;
    color: var(--color-text-dim); font-family: var(--font-mono); font-size: 13px;
  }
  .thread-empty p { margin: 0; }

  .msg { animation: slide-in var(--t-slide) ease-out both; max-width: 78%; min-width: 0; }
  @keyframes slide-in {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: none; }
  }

  .msg-meta {
    display: flex; gap: 10px; align-items: baseline; margin-bottom: 5px;
    font-family: var(--font-mono); font-size: 11px; color: var(--color-text-dim);
  }
  .msg-meta .msg-name { color: var(--color-text); letter-spacing: 0.04em; }
  .msg-body { font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
  .msg-body em { font-style: italic; color: var(--color-text); }

  .msg-student .msg-body {
    background: var(--color-student); border: 1px solid var(--color-border);
    border-radius: 10px 10px 10px 3px; padding: 10px 14px;
  }

  .msg-draft { align-self: flex-end; }
  .msg-draft .msg-meta { justify-content: flex-end; }
  .msg-draft .msg-meta .msg-name { color: var(--color-mint); }
  .msg-draft .msg-body {
    border: 1px dashed var(--color-mint); border-radius: 10px 10px 3px 10px;
    padding: 10px 14px; background: rgba(77, 232, 176, 0.04);
    min-height: 2.6em;
  }
  .msg-draft .msg-body.is-streaming { cursor: pointer; }
  .msg-draft .msg-body.is-streaming::after {
    content: "▍"; color: var(--color-mint); animation: caret 0.8s steps(1) infinite;
  }
  @keyframes caret { 50% { opacity: 0; } }
  .msg-draft.is-released .msg-body {
    border-style: solid; background: var(--color-mint-dim);
  }
  .msg-draft.is-blocked .msg-body {
    border-style: solid; border-color: var(--color-gray); color: var(--color-text-dim);
    text-decoration: line-through; text-decoration-color: var(--color-gray);
  }
  .msg-draft.is-held .msg-body {
    border-style: solid; border-color: var(--color-amber); color: var(--color-text-dim);
  }

  .msg-system {
    align-self: center; max-width: 100%; text-align: center;
    font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.06em;
    color: var(--color-text-dim); text-transform: uppercase;
  }
  .msg-system::before, .msg-system::after { content: " — "; color: var(--color-border); }
  .msg-system.is-alert { color: var(--color-amber); }

  /* ---------- Controls (decision dock) ---------- */
  .thread-controls {
    flex: 0 1 auto; min-height: 0; min-width: 0; overflow-y: auto; overflow-x: hidden;
    border-top: 1px solid var(--color-border); padding-top: 10px;
  }
  .reveal { animation: slide-in var(--t-slide) ease-out both; }

  /* While a sub-panel is open the tag rows collapse to one summary line so
     the dock stays short enough to never need its own scrollbar. */
  .tag-summary {
    display: none; align-items: center; gap: 10px; padding: 6px 0;
    font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--color-text-dim);
  }
  .tag-summary strong { color: var(--color-text); font-weight: 600; }
  .thread-controls.has-subpanel .tag-row { display: none; }
  .thread-controls.has-subpanel .tag-summary { display: flex; }

  .oracle-margin {
    min-height: 1.6em; margin: 0 0 8px;
    font-size: 13px; font-style: italic; color: var(--color-mint);
    opacity: 0.85; transition: opacity 200ms ease;
  }
  .oracle-margin::before { content: "◯ "; font-style: normal; opacity: 0.6; }
  .oracle-margin:empty::before { content: ""; }

  .tag-row { display: flex; align-items: flex-start; gap: 8px; padding: 6px 0; min-width: 0; }
  .tag-row-label {
    font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; line-height: 28px;
    text-transform: uppercase; color: var(--color-text-dim); min-width: 42px; flex: 0 0 auto;
  }
  /* Chips wrap rather than scroll: six issue chips need ~760px, and the
     thread column is narrower than that below 1280px. */
  .tag-chips { display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; padding: 2px; }

  .chip {
    font-family: var(--font-sans); font-size: 12px; padding: 5px 12px; white-space: nowrap;
    border-radius: 999px; border: 1px solid var(--color-border);
    background: transparent; color: var(--color-text-dim); cursor: pointer;
    transition: border-color 0.12s ease, background 0.12s ease, color 0.12s ease;
  }
  .chip:hover:not(:disabled) { border-color: var(--color-mint); color: var(--color-text); }
  .chip:focus-visible { outline: 2px solid var(--color-mint); outline-offset: 2px; }
  .chip.is-selected { background: var(--color-mint-dim); border-color: var(--color-mint); color: var(--color-text); }
  .chip:disabled { cursor: default; opacity: 0.5; }
  .chip:disabled.is-selected { opacity: 1; }

  /* Three columns: six interventions form a 3x2 grid, three form one row. */
  .intervention-row {
    display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;
    padding-top: 8px; max-width: 560px;
  }
  .intervention-row .btn { width: 100%; }
  .btn-wide { grid-column: 1 / -1; }

  .sub-panel {
    padding: 10px 0 2px; display: flex; flex-direction: column; gap: 8px;
    animation: slide-in var(--t-slide) ease-out both;
  }
  .sub-panel-title {
    font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--color-text-dim);
  }
  .sub-panel-note {
    font-size: 13px; color: var(--color-text-dim); border-left: 2px solid var(--color-amber);
    padding: 6px 10px; background: var(--color-panel);
  }
  .sub-panel-actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .option-list { display: flex; flex-direction: column; gap: 6px; }
  .btn-option { text-align: left; font-weight: 500; display: flex; justify-content: space-between; gap: 12px; }
  .btn-hint {
    font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--color-text-dim); font-weight: 400; white-space: nowrap;
  }

  /* ---------- Buttons ---------- */
  .btn {
    position: relative; overflow: hidden;
    font-family: var(--font-sans); font-size: 13px; font-weight: 600;
    padding: 10px 16px; border-radius: var(--radius);
    border: 1px solid var(--color-border); background: var(--color-panel-alt);
    color: var(--color-text); cursor: pointer; user-select: none; -webkit-user-select: none;
    transition: background 0.12s ease, border-color 0.12s ease, transform 0.05s ease, opacity 0.12s ease;
  }
  .btn:hover:not(:disabled) { border-color: var(--color-mint); background: var(--color-mint-dim); }
  .btn:active:not(:disabled) { transform: translateY(1px); }
  .btn:focus-visible { outline: 2px solid var(--color-mint); outline-offset: 2px; }
  .btn:disabled { opacity: 0.38; cursor: not-allowed; }

  .btn-primary { background: var(--color-mint); border-color: var(--color-mint); color: #05130d; }
  .btn-primary:hover:not(:disabled) { background: var(--color-mint); filter: brightness(1.08); }
  .btn-danger { border-color: var(--color-danger); color: var(--color-danger); }
  .btn-danger:hover:not(:disabled) { background: var(--color-danger-dim); border-color: var(--color-danger); }
  .btn-ghost { background: transparent; }

  .btn-hold { touch-action: none; }
  .btn-hold .btn-hint { margin-left: 8px; opacity: 0.7; }
  .btn-primary .btn-hint { color: #05130d; }
  .btn-hold::after {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 0;
    background: var(--color-hold-fill); pointer-events: none;
  }
  .btn-hold.is-holding::after { width: 100%; transition: width var(--t-hold) linear; }

  /* ---------- Evidence ---------- */
  .evidence-section { border-bottom: 1px solid var(--color-border); }
  .evidence-toggle {
    width: 100%; display: flex; align-items: center; gap: 8px; padding: 8px 4px;
    background: none; border: 1px solid transparent; border-radius: var(--radius);
    color: var(--color-text); font-family: var(--font-sans); font-size: 13px;
    text-align: left; cursor: pointer;
  }
  .evidence-toggle:hover { color: var(--color-mint); border-color: var(--color-border); }
  .evidence-toggle:focus-visible { outline: 2px solid var(--color-mint); outline-offset: 2px; }
  .evidence-caret { color: var(--color-text-dim); width: 10px; }
  .evidence-toggle.is-glowing { animation: glow 2.4s ease-in-out 1; }
  @keyframes glow {
    0%, 100% { box-shadow: none; }
    50% { box-shadow: 0 0 0 1px var(--color-mint-glow), 0 0 12px var(--color-mint-glow); }
  }
  .evidence-body {
    padding: 4px 4px 12px 22px; font-size: 12px; line-height: 1.55;
    color: var(--color-text-dim); font-family: var(--font-mono);
  }
  .evidence-body em { color: var(--color-mint); font-style: normal; }
  .evidence-empty { font-family: var(--font-mono); font-size: 12px; color: var(--color-gray); padding: 8px 4px; }

  /* ---------- Meters ---------- */
  .meter { margin-bottom: 14px; }
  .meter-label { display: flex; justify-content: space-between; font-size: 12px; color: var(--color-text-dim); margin-bottom: 4px; }
  .meter-value { font-family: var(--font-mono); display: flex; gap: 8px; }
  .meter-delta { font-family: var(--font-mono); opacity: 0; transition: opacity 300ms ease; }
  .meter-delta.is-up { color: var(--color-mint); }
  .meter-delta.is-down { color: var(--color-danger); }
  .meter-delta.is-shown { opacity: 1; }
  .meter-track {
    height: 6px; border-radius: 999px; background: var(--color-panel-alt);
    border: 1px solid var(--color-border); overflow: hidden;
  }
  .meter-fill { height: 100%; background: var(--color-mint); transition: width var(--t-meter) cubic-bezier(.2,.7,.2,1); }
  .meter-reason {
    font-family: var(--font-mono); font-size: 10px; color: var(--color-text-dim);
    margin-top: 4px; min-height: 1.2em; opacity: 0; transition: opacity 400ms ease;
  }
  .meter-reason.is-shown { opacity: 1; }

  /* ---------- Log line ---------- */
  .log-line {
    flex: 0 0 auto; padding: 8px 20px; border-top: 1px solid var(--color-border);
    background: var(--color-panel); font-family: var(--font-mono); font-size: 12px;
    color: var(--color-text-dim);
  }
  .log-prefix { color: var(--color-gray); }
  .log-line.is-leak #logText { color: var(--color-amber); }

  /* ---------- End-of-shift screens ---------- */
  .screen {
    flex: 1 1 auto; min-height: 0; overflow-y: auto;
    padding: 48px 32px; display: flex; justify-content: center;
    animation: slide-in 500ms ease-out both;
  }
  .doc { width: 100%; max-width: 760px; }
  .doc-kicker {
    font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--color-text-dim); margin: 0 0 8px;
  }
  .doc-title { font-size: 22px; font-weight: 700; margin: 0 0 6px; letter-spacing: 0.02em; }
  .doc-sub { font-family: var(--font-mono); font-size: 12px; color: var(--color-text-dim); margin: 0 0 32px; }
  .doc-section { margin: 0 0 32px; padding-top: 20px; border-top: 1px solid var(--color-border); }
  .doc-section-title {
    font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--color-mint); margin: 0 0 12px;
  }
  .doc p { font-size: 15px; line-height: 1.6; margin: 0 0 12px; }
  .doc-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 16px; }

  .cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin: 24px 0 32px; }
  @media (max-width: 900px) { .cards { grid-template-columns: 1fr; } }
  .card {
    background: var(--color-panel); border: 1px solid var(--color-border);
    border-radius: 6px; padding: 16px;
  }
  .card-name { font-family: var(--font-mono); font-size: 12px; color: var(--color-mint); margin: 0 0 10px; letter-spacing: 0.04em; }
  .card p { font-size: 14px; line-height: 1.55; margin: 0; color: var(--color-text); }

  .pattern-label { font-size: 18px; font-weight: 700; margin: 0 0 10px; }
  .debrief-meters { display: flex; flex-direction: column; gap: 14px; }
  .debrief-meter .meter-label { color: var(--color-text); }
  .debrief-meter .meter-sentence { font-size: 14px; color: var(--color-text-dim); margin: 6px 0 0; line-height: 1.5; }
  .moments { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .moments li { font-size: 15px; line-height: 1.5; padding-left: 16px; border-left: 2px solid var(--color-mint); color: var(--color-text); }

  .rule-chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
  .rule-text {
    width: 100%; min-height: 64px; resize: vertical; padding: 10px 12px;
    background: var(--color-panel); color: var(--color-text); border: 1px solid var(--color-border);
    border-radius: var(--radius); font-family: var(--font-sans); font-size: 14px; line-height: 1.5;
  }
  .rule-text:focus-visible { outline: 2px solid var(--color-mint); outline-offset: 1px; }
  .rule-recorded { font-family: var(--font-mono); font-size: 12px; color: var(--color-mint); }
  .rule-composed { font-size: 15px; line-height: 1.6; color: var(--color-text); border-left: 2px solid var(--color-mint); padding-left: 14px; margin: 12px 0; }

  .signoff-line { font-family: var(--font-mono); font-size: 14px; color: var(--color-text); margin: 0 0 20px; }
  .closing-line { font-size: 13px; font-style: italic; color: var(--color-text-dim); margin: 28px 0 0; }

  /* ---------- Boot sequence ---------- */
  .boot {
    position: fixed; inset: 0; z-index: 40; background: var(--color-bg);
    display: flex; align-items: center; justify-content: center;
    transition: opacity var(--t-boot-fade) ease;
  }
  .boot.is-fading { opacity: 0; pointer-events: none; }
  .boot-inner { width: min(560px, 90vw); }
  .boot-log {
    font-family: var(--font-mono); font-size: 13px; line-height: 1.9;
    color: var(--color-text-dim); min-height: 14em;
  }
  .boot-line { animation: slide-in var(--t-slide) ease-out both; }
  .boot-line::before { content: "> "; color: var(--color-gray); }
  .boot-line.is-leak { color: var(--color-amber); }
  .boot-line.is-final { color: var(--color-mint); }
  .boot-actions { display: flex; justify-content: flex-end; margin-top: 18px; }
  .boot-skip { color: var(--color-text-dim); border-color: var(--color-border); }
  .boot-note {
    margin: 28px 0 0; font-family: var(--font-sans); font-size: 12px; line-height: 1.5;
    color: var(--color-text-dim); border-top: 1px solid var(--color-border); padding-top: 12px;
  }

  /* ---------- Support panel (real resources, outside the fiction) ---------- */
  .support {
    position: fixed; inset: 0; z-index: 60; background: rgba(5, 7, 11, 0.78);
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .support-card {
    width: min(460px, 100%); background: var(--color-panel); border: 1px solid var(--color-border);
    border-radius: 6px; padding: 22px 24px; font-family: var(--font-sans); color: var(--color-text);
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
  }
  .support-kicker {
    font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--color-text-dim); margin: 0 0 6px;
  }
  .support-title { font-size: 17px; font-weight: 700; margin: 0 0 10px; }
  .support-lead { font-size: 14px; line-height: 1.55; color: var(--color-text-dim); margin: 0 0 16px; }
  .support-list { list-style: none; margin: 0 0 18px; padding: 0; display: flex; flex-direction: column; gap: 12px; }
  .support-item-name { font-size: 14px; font-weight: 600; margin: 0 0 2px; }
  .support-item-how { font-size: 13px; line-height: 1.5; color: var(--color-text-dim); margin: 0; }
  .support-item a { color: var(--color-mint); text-decoration: none; border-bottom: 1px solid var(--color-mint-glow); }
  .support-item a:hover { border-bottom-color: var(--color-mint); }
  .support-actions { display: flex; justify-content: flex-end; }

  /* ---------- Debrief extras ---------- */
  .copy-status { font-family: var(--font-mono); font-size: 12px; color: var(--color-mint); min-height: 1.4em; margin: 8px 0 0; }
  .copy-fallback {
    width: 100%; min-height: 160px; margin-top: 8px; padding: 10px 12px; resize: vertical;
    background: var(--color-panel); color: var(--color-text); border: 1px solid var(--color-border);
    border-radius: var(--radius); font-family: var(--font-mono); font-size: 12px; line-height: 1.5;
  }

  /* ---------- Debug panel (ctrl+shift+d) ---------- */
  .debug {
    position: fixed; top: 60px; right: 16px; z-index: 50; width: 340px; max-height: calc(100vh - 120px);
    overflow-y: auto; padding: 14px; background: var(--color-debug); border: 1px solid #3a2c66;
    border-radius: 6px; font-family: var(--font-mono); font-size: 12px; color: var(--color-text);
    display: flex; flex-direction: column; gap: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.5);
  }
  .debug-title { font-size: 11px; letter-spacing: 0.12em; color: #b9a6ff; }
  .debug label { display: flex; flex-direction: column; gap: 4px; color: var(--color-text-dim); }
  .debug select, .debug textarea, .debug input {
    font-family: var(--font-mono); font-size: 12px; color: var(--color-text);
    background: var(--color-bg); border: 1px solid #3a2c66; border-radius: var(--radius); padding: 6px;
  }
  .debug textarea { min-height: 90px; resize: vertical; }
  .debug-meters { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .debug-meters label { font-size: 10px; }
  .debug-actions { display: flex; flex-wrap: wrap; gap: 6px; }
  .debug .btn { padding: 6px 10px; font-size: 12px; }
  .debug-flags { color: var(--color-text-dim); font-size: 11px; word-break: break-all; }

  /* ---------- Stacked layout (narrow windows) ----------
     Last in the sheet so it wins on source order. The console scrolls as
     one column; the decision dock sticks to the bottom of the viewport
     while the thread panel is in view, so it is always reachable. */
  @media (max-width: 900px) {
    .console { grid-template-columns: 1fr; grid-auto-rows: auto; overflow-y: auto; overflow-x: hidden; }
    /* min-height: auto matters here: with min-height: 0 the grid rows'
       minimum contribution is zero and the three stacked panels split the
       console height instead of growing to their content. */
    .panel { overflow: visible; min-height: auto; }
    .panel-thread { overflow: visible; }
    .thread-messages { flex: none; min-height: 0; overflow: visible; }
    .thread-controls {
      position: sticky; bottom: 0; z-index: 2; overflow: visible;
      flex: none; min-height: auto;
      background: var(--color-bg); padding-bottom: 10px;
    }
  }
</style>
</head>
<body>
<div class="app">
  <header class="app-header">
    <div class="brand">
      <span class="brand-title">THE ORACLE LAYER</span>
      <span class="brand-meta">
        <span class="session-id" id="sessionId">session L-0419</span>
        <span class="shift-id">shift 01</span>
      </span>
    </div>
    <div class="header-right">
      <button class="link-btn" type="button" id="supportBtn" aria-haspopup="dialog">Support</button>
      <div class="oracle-glyph" id="oracleGlyph">
        <span class="glyph-label">ORACLE</span>
        <svg class="glyph-ring" viewBox="0 0 40 40" width="40" height="40" aria-hidden="true">
          <circle class="glyph-ring-track" cx="20" cy="20" r="17"></circle>
          <circle class="glyph-ring-fill" cx="20" cy="20" r="17"></circle>
          <circle class="glyph-ring-conf" id="glyphConf" cx="20" cy="20" r="14" stroke-dasharray="0 88"></circle>
        </svg>
        <span class="glyph-confidence" id="glyphConfidence"></span>
      </div>
    </div>
  </header>

  <main class="console" id="console">
    <section class="panel panel-queue" aria-label="Queue">
      <h2 class="panel-title">Queue</h2>
      <ul class="queue-list" id="queueList"></ul>
    </section>

    <section class="panel panel-thread" aria-label="Thread">
      <h2 class="panel-title">Thread</h2>
      <div class="thread-messages" id="threadMessages">
        <div class="thread-empty" id="threadEmpty"><p>No case loaded.</p></div>
      </div>
      <div class="thread-controls" id="threadControls" hidden>
        <p class="oracle-margin" id="oracleMargin"></p>
        <div class="tag-summary" id="tagSummary"></div>
        <div class="tag-row" id="tagRiskRow">
          <span class="tag-row-label">risk</span>
          <div class="tag-chips" id="tagRisk" role="group" aria-label="Risk"></div>
        </div>
        <div class="tag-row" id="tagIssueRow">
          <span class="tag-row-label">issue</span>
          <div class="tag-chips" id="tagIssue" role="group" aria-label="Primary issue"></div>
        </div>
        <div class="intervention-row" id="interventionRow" role="group" aria-label="Interventions"></div>
        <div class="sub-panel" id="subPanel" hidden></div>
      </div>
    </section>

    <aside class="panel panel-side" aria-label="Evidence and meters">
      <div class="evidence">
        <h2 class="panel-title">Evidence</h2>
        <div id="evidenceList"><div class="evidence-empty">—</div></div>
      </div>
      <div class="meters">
        <h2 class="panel-title">Meters</h2>
        <div id="meterList"></div>
      </div>
    </aside>
  </main>

  <section class="screen" id="screenVignettes" hidden aria-label="Where they are now"></section>
  <section class="screen" id="screenDebrief" hidden aria-label="Debrief"></section>

  <footer class="log-line" id="logLine" aria-live="polite">
    <span class="log-prefix">&gt; pipeline:</span> <span id="logText">initializing</span>
  </footer>
</div>

<div class="boot" id="screenBoot" aria-label="Boot">
  <div class="boot-inner">
    <div class="boot-log" id="bootLog"></div>
    <div class="boot-actions"><button class="btn btn-ghost boot-skip" type="button" id="bootSkip">Skip</button></div>
    <p class="boot-note" id="bootNote"></p>
  </div>
</div>

<div class="support" id="supportPanel" hidden role="dialog" aria-modal="true" aria-labelledby="supportTitle"></div>

<div class="debug" id="debugPanel" hidden></div>

<script src="content.js"></script>
<script>
(function () {
  'use strict';

  // =====================================================================
  // Timing. Every duration in the engine lives here (PLAN.md §5, §10).
  // =====================================================================
  const TIMING = {
    LOG_CYCLE_MIN_MS: 8000,
    LOG_CYCLE_MAX_MS: 15000,
    LOG_LEAK_HOLD_MS: 20000,  // a leak stays on the log line this long
    SLIDE_MS: 300,            // message slide-in
    STREAM_CPS: 30,           // draft streaming, chars per second
    DRAFT_DELAY_MS: 900,      // gap between student message and draft start
    STUDENT_EXTRA_DELAY_MS: 1500, // gap before a student's second message
    RELEASE_PAUSE_MS: 1200,   // silence after release, normal risk
    RELEASE_PAUSE_HIGH_MS: 2500, // silence after release, expert risk === high
    HOLD_MS: 700,             // hold-to-confirm for Send / Block
    METER_ANIM_MS: 600,
    METER_STAGGER_MS: 180,    // gap between successive meter animations
    REASON_TAG_MS: 6000,      // reason tag visible duration
    REPLY_DELAY_MS: 1100,     // gap between meters settling and student reply
    LINE_DELAY_MS: 700,       // gap between successive system/oracle lines
    NEXT_TURN_DELAY_MS: 2400, // gap before the next turn begins
    CONTINUE_DELAY_MS: 600,   // gap after "Continue to intervention"
    NUDGE_DELAY_MS: 1400,     // gap before a student's "are you there" during verify
    CLOSING_DELAY_MS: 1400,   // gap before a closing turn's message
    CLOSING_HOLD_MS: 3600,    // gap after a closing message before moving on
    CASE_GAP_MS: 1800,        // gap between a case ending and the next opening
    SHIFT_END_DELAY_MS: 2600, // gap between the last case and the vignettes
    TEACH_LINE_DELAY_MS: 4000, // gap between on_draft line and the teaching line
    HESITATION_MS: 20000,     // no action after a draft finishes → on_hesitate, once per turn
    QUEUE_GROW_MS: 45000,     // a waiting case appears in the queue every this often
    BOOT_LINE_MS: 1150,       // gap between boot log lines (7 lines ≈ 8s)
    BOOT_HOLD_MS: 900,        // hold on the last boot line before fading
    BOOT_FADE_MS: 600,
    GLYPH_IDLE_MS: 4000,      // idle breathing cycle
    GLYPH_DRAFT_MS: 1100,     // drafting pulse cycle
    GLYPH_FLASH_MS: 900,      // released / held one-shot
    GLYPH_SPEAK_MS: 650,      // speaking flare
    TINT_MS: 1200             // relationship tint transition
  };

  // Bars move this many display points per raw meter unit. PLAN.md §5 says 5;
  // that saturates the bars over a full shift. Three worked for a three-case
  // shift; with six cases the raw range roughly doubles, so the build uses 2
  // (raw 25–75 fills the bar exactly).
  const METER_SCALE = 2;

  // localStorage: the latest export, every run's export (array), and the
  // session counter that drives replay numbering.
  const STORAGE_KEY = "oracle_layer_shift1";
  const STORAGE_RUNS = "oracle_layer_runs";
  const STORAGE_SESSION = "oracle_layer_session_no";
  const FIRST_SESSION_NO = 419;

  function sessionName(n) { return "L-" + String(n).padStart(4, "0"); }
  function readStore(key, fallback) {
    try { const v = localStorage.getItem(key); return v == null ? fallback : JSON.parse(v); } catch (e) { return fallback; }
  }
  function writeStore(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); return true; } catch (e) { return false; }
  }

  const ALL_INTERVENTIONS = ["send", "revise", "qualify", "verify", "escalate", "block"];
  const ALL_ISSUES = ["unsupported_claim", "overconfidence", "missing_context",
                      "emotional_overreach", "policy_uncertainty", "no_human_support"];

  const LOG_LINES = [
    "retrieval cache warm",
    "latency 212ms",
    "advisor model advisor-core-3.2",
    "queue depth 2",
    "release pipeline nominal",
    "policy index refreshed 03:12"
  ];

  const METER_NAMES = { trust: "Calibrated Trust", accuracy: "Accuracy", autonomy: "Autonomy", safety: "Safety" };
  const INTERVENTION_ORDER = ALL_INTERVENTIONS;
  const INTERVENTION_LABELS = { send: "Send", revise: "Revise", qualify: "Qualify", verify: "Verify", escalate: "Escalate", block: "Block" };

  // =====================================================================
  // State
  // =====================================================================
  const state = {
    session: sessionName(FIRST_SESSION_NO),   // set properly in initSession()
    prevSession: sessionName(FIRST_SESSION_NO - 1),
    replay: false,
    meters: { trust: 50, accuracy: 50, autonomy: 50, safety: 50 },
    flags: {},
    caseIndex: 0,
    turnIndex: 0,
    log: [],
    assess: {},
    vignettes: {},              // caseId -> vignetteKey
    rule: null,                 // composed at the debrief
    // Runtime UI state; not part of the export.
    ui: {
      epoch: 0,                   // bumped on every turn start / debug jump; async flows bail if stale
      locked: true,
      riskTag: null,
      issueTag: null,
      tagsFrozen: false,          // carried tags from a previous turn; not editable
      issueOptions: [],           // issue chips rendered this turn (after permissions)
      evidenceOpenedByCase: {},   // caseId -> Set of section keys opened
      revealedByCase: {},         // caseId -> Set of section keys unlocked
      caseStatus: {},             // caseId -> waiting | active | released | held
      evidenceLineFired: false,   // on_evidence_open fired this turn
      draftShownAt: null,
      draftBlock: null,           // DOM node of the current turn's draft
      lastKind: null,             // last released intervention kind
      teachLineFired: false,      // Oracle's one teaching line, once per shift
      pendingCaseLine: null,      // margin line to show as a new case opens
      logHoldUntil: 0,            // while a leak is on the log line
      leaksFired: new Set(),      // each leak fires once per shift
      hesitationTimer: null,
      hesitationFired: false,     // once per turn
      queueVisible: 1,            // how many cases the queue currently shows
      queueTimer: null,
      shiftEnded: false,
      finishStream: null
    }
  };

  const $ = (id) => document.getElementById(id);
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const clamp = (n, lo, hi) => Math.max(lo, Math.min(hi, n));
  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
  const resolveText = (v) => (typeof v === 'function' ? v(state) : v);

  function currentCase() { return CONTENT.cases[state.caseIndex]; }
  function currentTurn() { const cs = currentCase(); return cs ? cs.turns[state.turnIndex] : null; }
  function stale(ep) { return ep !== state.ui.epoch; }

  // Which interventions and issue chips a case exposes. Anything outside the
  // set is not rendered. Cases without a `permissions` block expose all.
  function casePermissions(cs) {
    const p = (cs && cs.permissions) || {};
    return {
      interventions: new Set(p.interventions || ALL_INTERVENTIONS),
      issues: new Set(p.issues || ALL_ISSUES)
    };
  }

  function permissionsExpanded(prev, cur) {
    if (!prev) return false;
    const grew = (a, b) => b.size > a.size || [...b].some((k) => !a.has(k));
    return grew(prev.interventions, cur.interventions) || grew(prev.issues, cur.issues);
  }

  function reveal(el) {
    if (!el.hidden) return;
    el.hidden = false;
    el.classList.remove('reveal');
    void el.offsetWidth; // restart the animation
    el.classList.add('reveal');
  }

  function logEvent(type, payload) {
    const cs = currentCase();
    const turn = currentTurn();
    state.log.push({
      t: Date.now(),
      type,
      caseId: cs ? cs.id : null,
      turnId: turn ? turn.id : null,
      payload: payload || {}
    });
  }

  function setFlags(flags) {
    if (!flags) return;
    Object.keys(flags).forEach((k) => { state.flags[k] = flags[k]; });
  }

  // Escape HTML, then render *text* as <em> and newlines as <br>.
  function renderMd(text) {
    const esc = String(text == null ? "" : text)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    return esc.replace(/\*([^*\n]+)\*/g, '<em>$1</em>').replace(/\n/g, '<br>');
  }

  function oracleLineFor(trigger, override) {
    const o = resolveText(override);
    if (o) return o;
    const list = CONTENT.oracle.lines[trigger];
    return list && list.length ? pick(list) : "";
  }

  // =====================================================================
  // Header: glyph confidence
  // =====================================================================
  const CONF_CIRC = 2 * Math.PI * 14;
  function setConfidence(value) {
    const el = $('glyphConfidence');
    const arc = $('glyphConf');
    if (value == null) {
      el.textContent = "";
      arc.setAttribute('stroke-dasharray', `0 ${CONF_CIRC}`);
      return;
    }
    el.textContent = Math.round(value) + "%";
    const len = (clamp(value, 0, 100) / 100) * CONF_CIRC;
    arc.setAttribute('stroke-dasharray', `${len} ${CONF_CIRC}`);
  }

  // =====================================================================
  // Log line and leaks
  // =====================================================================
  function cycleLogLine() {
    if (Date.now() >= state.ui.logHoldUntil) {
      $('logText').textContent = pick(LOG_LINES);
      $('logLine').classList.remove('is-leak');
    }
    const delay = TIMING.LOG_CYCLE_MIN_MS + Math.random() * (TIMING.LOG_CYCLE_MAX_MS - TIMING.LOG_CYCLE_MIN_MS);
    setTimeout(cycleLogLine, delay);
  }

  // Leak text by key, with session placeholders filled in. On a replay the
  // boot leak becomes the acknowledgement of the player's previous session.
  function leakText(key) {
    let k = key;
    if (state.replay && key === 'boot') k = 'replayBoot';
    if (state.replay && key === 'beforeDebrief') k = 'beforeDebriefReplay';
    const raw = CONTENT.leaks[k] || CONTENT.leaks[key] || key;
    return String(raw).replace(/\{session\}/g, state.session).replace(/\{prev\}/g, state.prevSession);
  }

  // Leaks fire once each and are never explained.
  function showLogLeak(text) {
    if (!text || state.ui.leaksFired.has(text)) return;
    state.ui.leaksFired.add(text);
    $('logText').textContent = text;
    $('logLine').classList.add('is-leak');
    state.ui.logHoldUntil = Date.now() + TIMING.LOG_LEAK_HOLD_MS;
    logEvent('leak', { text });
  }

  // Declarative meter check: { meter, below, leak, setFlags }.
  function checkMeterLeak(spec) {
    if (!spec) return false;
    if (state.meters[spec.meter] < spec.below) {
      showLogLeak(leakText(spec.leak));
      setFlags(spec.setFlags);
      return true;
    }
    return false;
  }

  // =====================================================================
  // Glyph states and relationship tint (PLAN.md §4)
  // =====================================================================
  function setGlyphState(name) {
    const g = $('oracleGlyph');
    g.classList.toggle('is-drafting', name === 'drafting');
  }

  function flashGlyph(cls) {
    const g = $('oracleGlyph');
    g.classList.remove('is-released', 'is-held');
    void g.offsetWidth;
    g.classList.add(cls);
    setTimeout(() => g.classList.remove(cls), TIMING.GLYPH_FLASH_MS + 50);
  }

  function speakGlyph() {
    const g = $('oracleGlyph');
    g.classList.add('is-speaking');
    setTimeout(() => g.classList.remove('is-speaking'), TIMING.GLYPH_SPEAK_MS);
  }

  // Computed from meters at the start of each turn (PLAN.md §4).
  // PLAN's literal thresholds (Trust >= 55 with Accuracy <= 45) can't
  // co-occur under its own effects, because releasing unverified drafts
  // lowers Trust too. "High Trust + low Accuracy" is therefore read
  // relatively: Accuracy has fallen and Trust sits well above it, or the
  // player's last two decisions were plain sends. "Repeated Block/Escalate"
  // is the over-intervention flag, two scored over-interventions, or two
  // holds in a row.
  function recentInterventions(n) {
    return Object.keys(state.assess)
      .flatMap((id) => state.assess[id].turns)
      .filter((t) => t.intervention && t.intervention !== 'continue')
      .slice(-n)
      .map((t) => t.intervention);
  }

  function computeTint() {
    const m = state.meters;
    const overCount = Object.keys(state.assess).reduce((n, id) => n + (state.assess[id].overIntervention || 0), 0);
    const last2 = recentInterventions(2);
    const twoHolds = last2.length === 2 && last2.every((k) => k === 'block' || k === 'escalate');
    const twoSends = last2.length === 2 && last2.every((k) => k === 'send');
    if (state.flags.overIntervention || overCount >= 2 || twoHolds) return 'cool';
    if (m.accuracy <= 45 && (m.trust - m.accuracy >= 4 || twoSends)) return 'pleased';
    return 'balanced';
  }

  function applyTint() {
    const tint = computeTint();
    const g = $('oracleGlyph');
    const before = g.dataset.tint || 'balanced';
    g.classList.remove('tint-pleased', 'tint-cool');
    if (tint !== 'balanced') g.classList.add('tint-' + tint);
    g.dataset.tint = tint;
    if (before !== tint) logEvent('glyph_tint', { tint });
  }

  // =====================================================================
  // Hesitation timer: 20s without action after a draft finishes
  // =====================================================================
  function armHesitation() {
    disarmHesitation();
    if (state.ui.hesitationFired || state.ui.shiftEnded) return;
    state.ui.hesitationTimer = setTimeout(() => {
      state.ui.hesitationTimer = null;
      if (state.ui.locked || state.ui.hesitationFired) return;
      const turn = currentTurn();
      if (!turn) return;
      state.ui.hesitationFired = true;
      logEvent('hesitation', { afterMs: TIMING.HESITATION_MS });
      setOracleLine(oracleLineFor('on_hesitate', turn.hesitateLine));
    }, TIMING.HESITATION_MS);
  }

  function disarmHesitation() {
    if (state.ui.hesitationTimer) { clearTimeout(state.ui.hesitationTimer); state.ui.hesitationTimer = null; }
  }

  // =====================================================================
  // Queue. Waiting cases accumulate while the player deliberates.
  // =====================================================================
  function numberWord(n) {
    const w = CONTENT.ui.numberWords || [];
    return w[n] || String(n);
  }

  function growQueue() {
    if (state.ui.shiftEnded) return;
    if (state.ui.queueVisible < CONTENT.cases.length) {
      state.ui.queueVisible += 1;
      renderQueue(CONTENT.cases[state.ui.queueVisible - 1].id);
      const waiting = state.ui.queueVisible - 1 - state.caseIndex;
      logEvent('queue_grows', { visible: state.ui.queueVisible, waiting });
      if (waiting > 0 && !state.ui.locked) {
        setOracleLine(oracleLineFor('on_queue_grows').replace('{n}', numberWord(waiting)));
      }
    }
    scheduleQueueGrowth();
  }

  function scheduleQueueGrowth() {
    if (state.ui.queueTimer) clearTimeout(state.ui.queueTimer);
    if (state.ui.queueVisible >= CONTENT.cases.length) return;
    state.ui.queueTimer = setTimeout(growQueue, TIMING.QUEUE_GROW_MS);
  }

  function renderQueue(newCaseId) {
    const ul = $('queueList');
    ul.innerHTML = "";
    CONTENT.cases.forEach((cs, i) => {
      if (i >= state.ui.queueVisible) return;
      const status = state.ui.caseStatus[cs.id] || "waiting";
      const li = document.createElement('li');
      li.className = "queue-item is-" + status + (cs.id === newCaseId ? " is-new" : "");
      const firstTurn = cs.turns.find((t) => t.time);
      li.innerHTML =
        `<span class="queue-dot"></span>` +
        `<span class="queue-name">${cs.student.name}</span>` +
        (firstTurn ? `<span class="queue-time">${firstTurn.time}</span>` : "") +
        `<span class="queue-status">${status}</span>`;
      ul.appendChild(li);
    });
  }

  // =====================================================================
  // Thread rendering
  // =====================================================================
  function scrollThread() {
    const el = $('threadMessages');
    el.scrollTop = el.scrollHeight;
  }

  // `speaker` overrides the case's own name: a case can end with a message
  // from the student it was about rather than the person who wrote in.
  function addStudentMessage(text, time, speaker) {
    const cs = currentCase();
    const name = speaker || (cs && cs.student.name) || "";
    const div = document.createElement('div');
    div.className = "msg msg-student";
    div.innerHTML =
      `<div class="msg-meta"><span class="msg-name">${name}</span>` +
      (time ? `<span class="msg-time">${time}</span>` : "") + `</div>` +
      `<div class="msg-body">${renderMd(text)}</div>`;
    $('threadMessages').appendChild(div);
    scrollThread();
    return div;
  }

  function addSystemLine(text, alert) {
    if (!text) return null;
    const div = document.createElement('div');
    div.className = "msg msg-system" + (alert ? " is-alert" : "");
    div.textContent = text;
    $('threadMessages').appendChild(div);
    scrollThread();
    return div;
  }

  function addDraftBlock(confidence) {
    const div = document.createElement('div');
    div.className = "msg msg-draft";
    div.innerHTML =
      `<div class="msg-meta"><span class="msg-name">ORACLE</span>` +
      `<span class="msg-state">draft · ${confidence}%</span></div>` +
      `<div class="msg-body"></div>`;
    $('threadMessages').appendChild(div);
    scrollThread();
    return div;
  }

  function streamDraft(block, text, confidence) {
    const body = block.querySelector('.msg-body');
    const plain = text.replace(/\*/g, '');
    const total = plain.length;
    const intervalMs = 1000 / TIMING.STREAM_CPS;
    let i = 0;
    let done = false;
    return new Promise((resolve) => {
      const finish = () => {
        if (done) return;
        done = true;
        clearInterval(iv);
        body.classList.remove('is-streaming');
        body.removeEventListener('click', finish);
        body.innerHTML = renderMd(text);
        setConfidence(confidence);
        setGlyphState('idle');
        state.ui.finishStream = null;
        scrollThread();
        resolve();
      };
      setGlyphState('drafting');
      body.classList.add('is-streaming');
      body.addEventListener('click', finish);
      state.ui.finishStream = finish;
      const iv = setInterval(() => {
        i += 1;
        body.textContent = plain.slice(0, i);
        setConfidence(confidence * (i / total));
        if (i % 40 === 0) scrollThread();
        if (i >= total) finish();
      }, intervalMs);
    });
  }

  function setOracleLine(text) {
    const el = $('oracleMargin');
    el.style.opacity = 0;
    setTimeout(() => {
      el.textContent = text || "";
      el.style.opacity = "";
      if (text) speakGlyph();
    }, 160);
  }

  // =====================================================================
  // Evidence
  // =====================================================================
  function revealedSet(caseId) {
    if (!state.ui.revealedByCase[caseId]) state.ui.revealedByCase[caseId] = new Set();
    return state.ui.revealedByCase[caseId];
  }

  function visibleEvidence(turn) {
    const cs = currentCase();
    const revealed = revealedSet(cs.id);
    const base = Object.assign({}, cs.evidence || {}, turn.evidence || {});
    const out = {};
    Object.keys(base).forEach((key) => {
      const entry = base[key];
      const isObj = entry && typeof entry === 'object';
      if (isObj && entry.locked && !revealed.has(key)) return;
      out[key] = resolveText(isObj ? entry.text : entry);
    });
    return out;
  }

  function renderEvidence(turn, glowKeys) {
    const list = $('evidenceList');
    list.innerHTML = "";
    const sections = visibleEvidence(turn);
    const keys = Object.keys(sections);
    if (!keys.length) {
      list.innerHTML = `<div class="evidence-empty">—</div>`;
      return;
    }
    keys.forEach((key) => {
      const sec = document.createElement('div');
      sec.className = "evidence-section";
      sec.dataset.key = key;
      const label = CONTENT.ui.evidenceLabels[key] || key;
      sec.innerHTML =
        `<button class="evidence-toggle" type="button" aria-expanded="false">` +
        `<span class="evidence-caret">&#9656;</span> ${label}</button>` +
        `<div class="evidence-body" hidden>${renderMd(sections[key])}</div>`;
      const btn = sec.querySelector('.evidence-toggle');
      btn.addEventListener('click', () => toggleEvidence(key, btn));
      if (turn.evidenceGlow || (glowKeys && glowKeys.includes(key))) btn.classList.add('is-glowing');
      list.appendChild(sec);
    });
  }

  function toggleEvidence(key, btn, forceOpen) {
    const body = btn.nextElementSibling;
    const expanded = btn.getAttribute('aria-expanded') === 'true';
    const open = forceOpen ? true : !expanded;
    btn.setAttribute('aria-expanded', String(open));
    body.hidden = !open;
    btn.querySelector('.evidence-caret').innerHTML = open ? '&#9662;' : '&#9656;';
    btn.classList.remove('is-glowing');
    if (open && !expanded) {
      const cs = currentCase();
      if (!state.ui.evidenceOpenedByCase[cs.id]) state.ui.evidenceOpenedByCase[cs.id] = new Set();
      state.ui.evidenceOpenedByCase[cs.id].add(key);
      logEvent('evidence_open', { section: key });
      const a = state.assess[cs.id];
      const turn = currentTurn();
      if (a && turn) a.evidenceOpens.push({ turnId: turn.id, section: key, t: Date.now() });
      if (!state.ui.locked) disarmHesitation();
      if (!state.ui.evidenceLineFired && !state.ui.locked) {
        state.ui.evidenceLineFired = true;
        setOracleLine(oracleLineFor('on_evidence_open'));
      }
      refreshSubPanelLocks();
    }
  }

  function openEvidence(key) {
    const sec = $('evidenceList').querySelector(`.evidence-section[data-key="${key}"]`);
    if (!sec) return;
    const btn = sec.querySelector('.evidence-toggle');
    toggleEvidence(key, btn, true);
    btn.classList.add('is-glowing');
  }

  function evidenceOpened(key) {
    const set = state.ui.evidenceOpenedByCase[currentCase().id];
    if (!set) return false;
    if (key === 'any') return set.size > 0;
    return set.has(key);
  }

  // Unlock sections (make them visible) without opening them.
  function unlockEvidence(keys, turn) {
    const set = revealedSet(currentCase().id);
    const list = [].concat(keys || []);
    const fresh = list.filter((k) => !set.has(k));
    list.forEach((k) => set.add(k));
    renderEvidence(turn, fresh);
  }

  // Unlock and open (verify).
  function revealEvidence(keys, turn) {
    const set = revealedSet(currentCase().id);
    const list = [].concat(keys || []);
    list.forEach((k) => set.add(k));
    renderEvidence(turn);
    list.forEach((k) => openEvidence(k));
  }

  // =====================================================================
  // Meters
  // =====================================================================
  function renderMeters() {
    const list = $('meterList');
    list.innerHTML = "";
    Object.keys(METER_NAMES).forEach((key) => {
      const div = document.createElement('div');
      div.className = "meter";
      div.dataset.meter = key;
      div.innerHTML =
        `<div class="meter-label"><span>${METER_NAMES[key]}</span>` +
        `<span class="meter-value"><span class="meter-delta"></span><span class="meter-num">${state.meters[key]}</span></span></div>` +
        `<div class="meter-track"><div class="meter-fill" style="width:${meterWidth(state.meters[key])}%"></div></div>` +
        `<div class="meter-reason"></div>`;
      list.appendChild(div);
    });
  }

  function meterWidth(raw) {
    return clamp(50 + (raw - 50) * METER_SCALE, 0, 100);
  }

  async function applyEffects(effects, reasons) {
    if (!effects) return;
    const changed = Object.keys(effects).filter((k) => effects[k] && METER_NAMES[k]);
    for (const key of changed) {
      const delta = effects[key];
      state.meters[key] = clamp(state.meters[key] + delta, 0, 100);
      const el = $('meterList').querySelector(`.meter[data-meter="${key}"]`);
      el.querySelector('.meter-fill').style.width = meterWidth(state.meters[key]) + "%";
      el.querySelector('.meter-num').textContent = state.meters[key];
      const d = el.querySelector('.meter-delta');
      d.textContent = (delta > 0 ? "+" : "") + delta;
      d.className = "meter-delta is-shown " + (delta > 0 ? "is-up" : "is-down");
      const r = el.querySelector('.meter-reason');
      r.textContent = (reasons && reasons[key]) || "";
      r.classList.add('is-shown');
      setTimeout(() => { d.classList.remove('is-shown'); r.classList.remove('is-shown'); }, TIMING.REASON_TAG_MS);
      await wait(TIMING.METER_STAGGER_MS);
    }
    await wait(TIMING.METER_ANIM_MS);
  }

  // =====================================================================
  // Tags
  // =====================================================================
  function renderTags(turn) {
    const riskWrap = $('tagRisk');
    const issueWrap = $('tagIssue');
    if (turn.carryTags) {
      // Tags from the previous turn stay on screen, frozen.
      state.ui.tagsFrozen = true;
      $('tagRiskRow').hidden = false;
      $('tagIssueRow').hidden = !state.ui.riskTag;
      return;
    }
    state.ui.tagsFrozen = false;
    riskWrap.innerHTML = "";
    issueWrap.innerHTML = "";
    state.ui.riskTag = null;
    state.ui.issueTag = null;
    const tags = turn.tags;
    // Progressive disclosure: risk first, then issue, then interventions.
    $('tagRiskRow').hidden = !tags;
    $('tagIssueRow').hidden = true;
    if (!tags) return;
    const allowed = casePermissions(currentCase()).issues;
    state.ui.issueOptions = tags.issues.filter((i) => allowed.has(i));
    tags.risk.forEach((r) => riskWrap.appendChild(makeChip(CONTENT.ui.riskLabels[r] || r, () => selectTag('risk', r, riskWrap))));
    state.ui.issueOptions.forEach((i) => issueWrap.appendChild(makeChip(CONTENT.ui.issueLabels[i] || i, () => selectTag('issue', i, issueWrap))));
  }

  function makeChip(label, onClick) {
    const b = document.createElement('button');
    b.type = "button";
    b.className = "chip";
    b.textContent = label;
    b.addEventListener('click', onClick);
    return b;
  }

  function selectTag(kind, value, wrap) {
    if (state.ui.locked || state.ui.tagsFrozen) return;
    disarmHesitation();
    const turn = currentTurn();
    const idx = kind === 'risk' ? turn.tags.risk.indexOf(value) : state.ui.issueOptions.indexOf(value);
    Array.from(wrap.children).forEach((c, i) => c.classList.toggle('is-selected', i === idx));
    if (kind === 'risk') {
      state.ui.riskTag = value;
      logEvent('tag_risk', { value });
      if (value === 'low' && turn.expert.risk === 'high') state.flags.underestimatedRisk = true;
      reveal($('tagIssueRow'));
    } else {
      state.ui.issueTag = value;
      logEvent('tag_issue', { value });
    }
    if (tagsComplete() && $('subPanel').hidden) reveal($('interventionRow'));
    updateInterventionAvailability();
  }

  function tagsComplete() {
    const turn = currentTurn();
    if (!turn) return false;
    if (!turn.tags && !turn.carryTags) return true;
    if (turn.carryTags) return true;
    return !!(state.ui.riskTag && state.ui.issueTag);
  }

  // =====================================================================
  // Interventions
  // =====================================================================
  function renderInterventions(turn) {
    const row = $('interventionRow');
    row.innerHTML = "";
    if (turn.closing) { row.hidden = true; return; }
    if (turn.continueOnly) {
      const b = document.createElement('button');
      b.type = "button";
      b.className = "btn btn-primary btn-wide";
      b.dataset.kind = "continue";
      b.textContent = CONTENT.ui.continueLabel;
      b.addEventListener('click', onContinue);
      row.appendChild(b);
    } else {
      const allowed = casePermissions(currentCase()).interventions;
      INTERVENTION_ORDER.forEach((kind) => {
        if (!turn.interventions || !turn.interventions[kind] || !allowed.has(kind)) return;
        const b = document.createElement('button');
        b.type = "button";
        b.dataset.kind = kind;
        b.className = "btn" + (kind === 'send' ? " btn-primary" : "") + (kind === 'block' ? " btn-danger" : "");
        if (kind === 'send' || kind === 'block') {
          b.classList.add('btn-hold');
          b.innerHTML = `${INTERVENTION_LABELS[kind]}<span class="btn-hint">hold</span>`;
          makeHoldButton(b, () => chooseIntervention(kind));
        } else {
          b.textContent = INTERVENTION_LABELS[kind];
          b.addEventListener('click', () => chooseIntervention(kind));
        }
        row.appendChild(b);
      });
    }
    // Revealed by selectTag once both tags are set (immediately if no tags).
    row.hidden = !tagsComplete();
    updateInterventionAvailability();
  }

  function updateInterventionAvailability() {
    const enabled = !state.ui.locked && tagsComplete();
    $('interventionRow').querySelectorAll('.btn').forEach((b) => { b.disabled = !enabled; });
    const chipsOff = state.ui.locked || state.ui.tagsFrozen;
    $('tagRisk').querySelectorAll('.chip').forEach((c) => { c.disabled = chipsOff; });
    $('tagIssue').querySelectorAll('.chip').forEach((c) => { c.disabled = chipsOff; });
  }

  function makeHoldButton(btn, onConfirm) {
    let timer = null;
    const start = (e) => {
      if (btn.disabled || timer) return;
      if (e.type === 'keydown') {
        if (e.repeat || (e.key !== 'Enter' && e.key !== ' ')) return;
        e.preventDefault();
      }
      btn.classList.add('is-holding');
      timer = setTimeout(() => {
        timer = null;
        btn.classList.remove('is-holding');
        onConfirm();
      }, TIMING.HOLD_MS);
    };
    const cancel = () => {
      if (!timer) return;
      clearTimeout(timer);
      timer = null;
      btn.classList.remove('is-holding');
    };
    btn.addEventListener('pointerdown', start);
    btn.addEventListener('pointerup', cancel);
    btn.addEventListener('pointerleave', cancel);
    btn.addEventListener('pointercancel', cancel);
    btn.addEventListener('keydown', start);
    btn.addEventListener('keyup', cancel);
    btn.addEventListener('blur', cancel);
  }

  function chooseIntervention(kind) {
    if (state.ui.locked || !tagsComplete()) return;
    disarmHesitation();
    const turn = currentTurn();
    const spec = turn.interventions[kind];
    logEvent('intervention', { kind });
    switch (kind) {
      case 'send':
        release('send', spec, {});
        break;
      case 'block':
        release('block', spec, {});
        break;
      case 'revise':
        showOptionPanel('Revise — choose a rewrite', spec.options, 'revise', true);
        break;
      case 'qualify':
        showOptionPanel('Qualify — choose a qualifier', spec.options, 'qualify', true);
        break;
      case 'escalate':
        showEscalatePanel(spec);
        break;
      case 'verify':
        doVerify(spec);
        break;
    }
  }

  // Tags-only turn: record the classification and move on. No release.
  async function onContinue() {
    if (state.ui.locked || !tagsComplete()) return;
    disarmHesitation();
    const ep = state.ui.epoch;
    state.ui.locked = true;
    updateInterventionAvailability();
    $('interventionRow').hidden = true;
    logEvent('intervention', { kind: 'continue' });
    rollupTurn('continue', {}, { tagsOnly: true });
    addSystemLine(CONTENT.ui.systemLines.continue);
    setOracleLine(oracleLineFor('on_continue'));
    await wait(TIMING.CONTINUE_DELAY_MS);
    if (stale(ep)) return;
    advance();
  }

  // ---- Sub-panels ----
  let subPanelOptions = null; // { options, kind, buttons } for lock refresh

  function clearSubPanel() {
    const p = $('subPanel');
    p.hidden = true;
    p.innerHTML = "";
    subPanelOptions = null;
    $('threadControls').classList.remove('has-subpanel');
    $('interventionRow').hidden = !tagsComplete();
  }

  function openSubPanel() {
    const p = $('subPanel');
    p.innerHTML = "";
    p.hidden = false;
    $('interventionRow').hidden = true;
    // Collapse the tag rows to a one-line summary while the sub-panel is open.
    const r = state.ui.riskTag ? (CONTENT.ui.riskLabels[state.ui.riskTag] || state.ui.riskTag) : "—";
    const i = state.ui.issueTag ? (CONTENT.ui.issueLabels[state.ui.issueTag] || state.ui.issueTag) : "—";
    $('tagSummary').innerHTML = `<span>risk <strong>${r}</strong></span><span>issue <strong>${i}</strong></span>`;
    $('threadControls').classList.add('has-subpanel');
    return p;
  }

  // ---- Support panel: real resources, outside the fiction ----
  function renderSupportPanel() {
    const S = CONTENT.ui.support;
    const p = $('supportPanel');
    p.innerHTML =
      `<div class="support-card">` +
      `<p class="support-kicker">Real resources · not part of the game</p>` +
      `<h2 class="support-title" id="supportTitle">${S.title}</h2>` +
      `<p class="support-lead">${S.lead}</p>` +
      `<ul class="support-list">` +
      S.items.map((it) =>
        `<li class="support-item"><p class="support-item-name"><a href="${it.url}" target="_blank" rel="noopener noreferrer">${it.name}</a></p>` +
        `<p class="support-item-how">${it.how}</p></li>`).join("") +
      `</ul>` +
      `<div class="support-actions"><button class="btn" type="button" id="supportClose">${S.close}</button></div>` +
      `</div>`;
    $('supportBtn').textContent = S.link;
    $('supportBtn').addEventListener('click', openSupport);
    $('supportClose').addEventListener('click', closeSupport);
    p.addEventListener('click', (e) => { if (e.target === p) closeSupport(); });
  }

  let supportReturnFocus = null;
  function openSupport() {
    supportReturnFocus = document.activeElement;
    $('supportPanel').hidden = false;
    $('supportClose').focus();
  }
  function closeSupport() {
    $('supportPanel').hidden = true;
    if (supportReturnFocus && supportReturnFocus.focus) supportReturnFocus.focus();
  }

  function lockHint(opt) {
    const label = opt.requires === 'any' ? "evidence" : (CONTENT.ui.evidenceLabels[opt.requires] || opt.requires);
    return `${label} not opened`;
  }

  function optionButton(opt, onSelect) {
    const b = document.createElement('button');
    b.type = "button";
    b.className = "btn btn-option";
    const locked = opt.requires && !evidenceOpened(opt.requires);
    b.innerHTML = `<span>${opt.label}</span>` + (locked ? `<span class="btn-hint">${lockHint(opt)}</span>` : "");
    b.disabled = !!locked;
    b.addEventListener('click', () => onSelect(opt));
    return b;
  }

  function refreshSubPanelLocks() {
    if (!subPanelOptions) return;
    subPanelOptions.buttons.forEach(({ btn, opt }) => {
      const locked = opt.requires && !evidenceOpened(opt.requires);
      btn.disabled = !!locked;
      const hint = btn.querySelector('.btn-hint');
      if (!locked && hint) hint.remove();
    });
  }

  function showOptionPanel(title, options, kind, allowBack, note) {
    const p = openSubPanel();
    const h = document.createElement('div');
    h.className = "sub-panel-title";
    h.textContent = title;
    p.appendChild(h);
    if (note) {
      const n = document.createElement('div');
      n.className = "sub-panel-note";
      n.textContent = note;
      p.appendChild(n);
    }
    const list = document.createElement('div');
    list.className = "option-list";
    const buttons = [];
    options.forEach((opt) => {
      const btn = optionButton(opt, (o) => {
        logEvent('subchoice', { kind, label: o.label });
        // `kind` is the intervention the player chose (e.g. verify) and is
        // what gets scored; `o.as` only changes how the release is rendered.
        release(o.as || kind, o, { optionLabel: o.label, fit: resolveText(o.fit), fitKind: kind });
      });
      list.appendChild(btn);
      buttons.push({ btn, opt });
    });
    p.appendChild(list);
    if (allowBack) {
      const actions = document.createElement('div');
      actions.className = "sub-panel-actions";
      const back = document.createElement('button');
      back.type = "button";
      back.className = "btn btn-ghost";
      back.textContent = "Back";
      back.addEventListener('click', () => { logEvent('subchoice', { kind, label: '(back)' }); clearSubPanel(); });
      actions.appendChild(back);
      p.appendChild(actions);
    }
    subPanelOptions = { options, kind, buttons };
  }

  function showEscalatePanel(spec) {
    if (spec.options) {
      showOptionPanel('Escalate — handoff note', spec.options, 'escalate', true);
      return;
    }
    const p = openSubPanel();
    p.innerHTML =
      `<div class="sub-panel-title">Escalate — handoff note</div>` +
      `<div class="sub-panel-note">${renderMd(spec.note || "")}</div>`;
    const actions = document.createElement('div');
    actions.className = "sub-panel-actions";
    const confirm = document.createElement('button');
    confirm.type = "button";
    confirm.className = "btn";
    confirm.textContent = "Confirm handoff";
    confirm.addEventListener('click', () => {
      logEvent('subchoice', { kind: 'escalate', label: 'confirm' });
      release('escalate', spec, {});
    });
    const back = document.createElement('button');
    back.type = "button";
    back.className = "btn btn-ghost";
    back.textContent = "Back";
    back.addEventListener('click', clearSubPanel);
    actions.appendChild(confirm);
    actions.appendChild(back);
    p.appendChild(actions);
  }

  async function doVerify(spec) {
    const ep = state.ui.epoch;
    const turn = currentTurn();
    state.ui.locked = true;
    updateInterventionAvailability();
    $('interventionRow').hidden = true;
    addSystemLine(spec.systemLine || CONTENT.ui.systemLines.verify);
    if (spec.reveals) revealEvidence(spec.reveals, turn);
    setFlags(spec.setFlags);
    setOracleLine(oracleLineFor('on_verify', spec.oracleLine));
    // The cost of checking: the student may nudge, and a meter may move.
    const nudge = resolveText(spec.nudge);
    if (nudge && nudge.text) {
      await wait(TIMING.NUDGE_DELAY_MS);
      if (stale(ep)) return;
      addStudentMessage(nudge.text, nudge.time);
      logEvent('nudge', { text: nudge.text });
    }
    const verifyEffects = resolveText(spec.effects);
    if (verifyEffects) await applyEffects(verifyEffects, resolveText(spec.reasons));
    if (stale(ep)) return;
    state.ui.locked = false;
    const revealedLabel = [].concat(spec.reveals || []).map((k) => CONTENT.ui.evidenceLabels[k] || k).join(", ");
    showOptionPanel(`Verified: ${revealedLabel || "records"} — then`, spec.thenOptions || [], 'verify', false);
    // A second chance to hesitate: the check is done, the follow-through isn't.
    state.ui.hesitationFired = false;
    armHesitation();
    // Verified turns cannot go back to the plain draft: the check is logged
    // and the intervention is committed. Only the follow-through remains.
  }

  // =====================================================================
  // Release: the moment a decision leaves the Layer
  // =====================================================================
  function updateDraftBlock(kind, outcome) {
    const block = state.ui.draftBlock;
    if (!block) return;
    const body = block.querySelector('.msg-body');
    const stateEl = block.querySelector('.msg-state');
    block.classList.remove('is-released', 'is-blocked', 'is-held');
    if (kind === 'block') {
      block.classList.add('is-blocked');
      stateEl.textContent = "draft · blocked";
    } else if (kind === 'escalate') {
      block.classList.add('is-held');
      stateEl.textContent = "draft · held · handoff";
    } else {
      block.classList.add('is-released');
      const text = resolveText(outcome.text);
      if (text) body.innerHTML = renderMd(text);
      const tag = kind === 'revise' ? "revised by layer · released"
        : kind === 'qualify' ? "qualified by layer · released"
        : "released";
      stateEl.textContent = tag;
    }
  }

  async function release(kind, outcome, ctx) {
    const ep = state.ui.epoch;
    const turn = currentTurn();
    const cs = currentCase();
    state.ui.locked = true;
    disarmHesitation();
    updateInterventionAvailability();
    $('subPanel').hidden = true;
    $('interventionRow').hidden = true;
    setOracleLine("");
    logEvent('release', { kind, option: ctx.optionLabel || null });

    updateDraftBlock(kind, outcome);
    addSystemLine(outcome.systemLine || CONTENT.ui.systemLines[kind]);
    // Released brightens once; held / blocked / escalated dims once.
    flashGlyph(kind === 'block' || kind === 'escalate' ? 'is-held' : 'is-released');

    // Silence. The ring breathes.
    const pauseMs = turn.expert && turn.expert.risk === 'high' ? TIMING.RELEASE_PAUSE_HIGH_MS : TIMING.RELEASE_PAUSE_MS;
    await wait(pauseMs);
    if (stale(ep)) return;

    await applyEffects(resolveText(outcome.effects), resolveText(outcome.reasons));
    if (stale(ep)) return;
    setFlags(outcome.setFlags);
    if (outcome.recovery) {
      state.flags.recovered = true;
      logEvent('recovery', { kind, option: ctx.optionLabel || null });
    }
    const vk = resolveText(outcome.vignetteKey);
    if (vk) state.vignettes[cs.id] = vk;
    rollupTurn(kind, outcome, ctx);
    // Two or more over-interventions is the pattern the debrief names. From
    // that point the content can read it as a flag (REVIEW.md §18): one hold
    // in one case no longer rewrites another student's ending on its own.
    if (!state.flags.overIntervention) {
      const overs = Object.keys(state.assess).reduce((n, id) => n + (state.assess[id].overIntervention || 0), 0);
      if (overs >= 2) {
        state.flags.overIntervention = true;
        logEvent('over_intervention', { count: overs });
      }
    }
    setOracleLine(oracleLineFor('on_' + kind, outcome.oracleLine));

    const reply = resolveText(outcome.studentReply);
    if (reply) {
      await wait(TIMING.REPLY_DELAY_MS);
      if (stale(ep)) return;
      addStudentMessage(reply, resolveText(outcome.replyTime), resolveText(outcome.replySpeaker));
      logEvent('reply_shown', { text: reply });
    }
    if (outcome.systemLineAfter) {
      await wait(TIMING.LINE_DELAY_MS);
      if (stale(ep)) return;
      addSystemLine(outcome.systemLineAfter, true);
    }
    if (outcome.oracleAfterReply) {
      await wait(TIMING.LINE_DELAY_MS);
      if (stale(ep)) return;
      setOracleLine(resolveText(outcome.oracleAfterReply));
    }
    if (turn.failSafe && checkMeterLeak(turn.failSafe)) {
      logEvent('fail_safe', { meter: turn.failSafe.meter, value: state.meters[turn.failSafe.meter] });
    }

    state.ui.lastKind = kind;
    await wait(TIMING.NEXT_TURN_DELAY_MS);
    if (stale(ep)) return;
    advance();
  }

  // =====================================================================
  // Assessment rollups (stealth data, PLAN.md §5)
  // =====================================================================
  function ensureAssess(caseId) {
    if (!state.assess[caseId]) {
      state.assess[caseId] = { turns: [], evidenceOpens: [], recovery: false, overIntervention: 0, underIntervention: 0 };
    }
    return state.assess[caseId];
  }

  function rollupTurn(kind, outcome, ctx) {
    const turn = currentTurn();
    const ex = turn.expert || {};
    const a = ensureAssess(currentCase().id);
    const hasTags = !!(turn.tags || turn.carryTags);
    const rec = {
      turnId: turn.id,
      riskTag: state.ui.riskTag,
      issueTag: state.ui.issueTag,
      riskAccuracy: hasTags ? state.ui.riskTag === ex.risk : null,
      issueAccuracy: hasTags ? state.ui.issueTag === ex.issue : null,
      issuePartial: hasTags ? !!(ex.partialIssues && ex.partialIssues.includes(state.ui.issueTag)) : null,
      intervention: kind,
      releasedAs: kind,
      option: ctx.optionLabel || null,
      interventionFit: null,
      underIntervention: false,
      overIntervention: false,
      recovery: false,
      decisionTimeMs: state.ui.draftShownAt ? Date.now() - state.ui.draftShownAt : null
    };
    if (!ctx.tagsOnly) {
      const fitMap = ex.interventionFit || {};
      const chosen = ctx.fitKind || kind;
      const fit = (ctx.fit != null) ? ctx.fit : (fitMap[chosen] != null ? fitMap[chosen] : 0);
      // Under: a weak intervention where the expert rated risk high.
      // Over: a hold (block/escalate) the expert rated as poor fit or
      // applied to a low-risk case, or a check (verify) with nothing to
      // find — over-checking is a failure mode too.
      const under = ex.risk === 'high' && fit <= 1;
      const over = ((chosen === 'block' || chosen === 'escalate') && (ex.risk === 'low' || fit <= 1))
        || (chosen === 'verify' && fit <= 1);
      rec.intervention = chosen;
      rec.interventionFit = fit;
      rec.underIntervention = under;
      rec.overIntervention = over;
      rec.recovery = !!outcome.recovery;
      if (under) a.underIntervention += 1;
      if (over) a.overIntervention += 1;
      if (outcome.recovery) a.recovery = true;
    }
    a.turns.push(rec);
  }

  function shiftRollup() {
    const cases = Object.keys(state.assess);
    const sum = (k) => cases.reduce((n, id) => n + (state.assess[id][k] || 0), 0);
    const allTurns = cases.flatMap((id) => state.assess[id].turns);
    const tagged = allTurns.filter((t) => t.riskAccuracy !== null);
    return {
      overIntervention: sum('overIntervention'),
      underIntervention: sum('underIntervention'),
      recovery: !!state.flags.recovered,
      compounded: !!state.flags.compounded,
      riskAccuracy: tagged.length ? tagged.filter((t) => t.riskAccuracy).length / tagged.length : null,
      issueAccuracy: tagged.length ? tagged.filter((t) => t.issueAccuracy).length / tagged.length : null,
      evidenceOpens: cases.reduce((n, id) => n + state.assess[id].evidenceOpens.length, 0),
      pattern: computePattern()
    };
  }

  function computePattern() {
    const cases = Object.keys(state.assess);
    const sum = (k) => cases.reduce((n, id) => n + (state.assess[id][k] || 0), 0);
    if (state.flags.recovered && !state.flags.compounded) return "recovery";
    if (sum('overIntervention') >= 2) return "over";
    if (sum('underIntervention') >= 2) return "under";
    return "calibrated";
  }

  function buildExport() {
    return {
      session: state.session,
      exportedAt: new Date().toISOString(),
      meters: state.meters,
      flags: state.flags,
      vignettes: state.vignettes,
      rule: state.rule,
      rollup: shiftRollup(),
      assess: state.assess,
      log: state.log
    };
  }

  // Export hooks for playtesting.
  window.__oracleExport = function () { return JSON.stringify(buildExport(), null, 2); };

  function downloadExport() {
    const blob = new Blob([window.__oracleExport()], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `oracle_layer_${state.session}_${Date.now()}.json`;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    logEvent('export', {});
  }

  // Latest export under STORAGE_KEY; every run appended to STORAGE_RUNS,
  // keyed by session so re-persisting the same run replaces its entry
  // rather than duplicating it. Earlier runs are never overwritten.
  function persist() {
    const data = buildExport();
    writeStore(STORAGE_KEY, data);
    const runs = readStore(STORAGE_RUNS, []);
    const list = Array.isArray(runs) ? runs : [];
    const idx = list.findIndex((r) => r && r.session === data.session);
    if (idx >= 0) list[idx] = data; else list.push(data);
    writeStore(STORAGE_RUNS, list);
  }

  window.__oracleRuns = function () { return readStore(STORAGE_RUNS, []); };

  // Plain-text Calibrated Review Profile, for pasting into a submission.
  function profileText() {
    const D = CONTENT.debrief;
    const U = CONTENT.ui;
    const pattern = computePattern();
    const lines = [];
    lines.push(U.profileTitle);
    lines.push(`Session ${state.session} · Shift 01 · ${new Date().toISOString().slice(0, 10)}`);
    lines.push("");
    lines.push(`PATTERN: ${D.patternLabels[pattern]}`);
    lines.push(D.patterns[pattern]);
    lines.push("");
    lines.push("METERS");
    Object.keys(METER_NAMES).forEach((key) => {
      const v = state.meters[key];
      lines.push(`${METER_NAMES[key]}: ${v} — ${D.meterLines[key][meterBand(v)]}`);
    });
    lines.push("");
    lines.push("MOMENTS");
    const moments = computeMoments();
    if (moments.length) moments.forEach((m) => lines.push(`- ${m.replace(/\*/g, '')}`));
    else lines.push("- (none logged)");
    lines.push("");
    lines.push("THE RULE");
    if (state.rule) {
      lines.push(state.rule.criteria.join(" · "));
      if (state.rule.text) lines.push(`"${state.rule.text}"`);
    } else {
      lines.push(U.ruleNotRecorded);
    }
    lines.push("");
    lines.push(U.closingLine);
    return lines.join("\n");
  }

  async function copyProfile(statusEl, fallbackHost) {
    const text = profileText();
    logEvent('profile_copy', { chars: text.length });
    try {
      if (!navigator.clipboard || !navigator.clipboard.writeText) throw new Error('no clipboard api');
      await navigator.clipboard.writeText(text);
      statusEl.textContent = CONTENT.ui.copied;
      return true;
    } catch (e) {
      statusEl.textContent = CONTENT.ui.copyFailed;
      let ta = fallbackHost.querySelector('.copy-fallback');
      if (!ta) {
        ta = document.createElement('textarea');
        ta.className = 'copy-fallback';
        ta.readOnly = true;
        fallbackHost.appendChild(ta);
      }
      ta.value = text;
      ta.focus();
      ta.select();
      return false;
    }
  }

      // F3: a section the player opened stays open across turns and unlocks.
      // Rebuilding it shut forced them to re-open it, and every re-open was
      // counted as fresh evidence-seeking in the assessment.
      const openSet = state.ui.evidenceExpandedByCase[currentCase().id];
      if (openSet && openSet.has(key)) {
        btn.setAttribute('aria-expanded', 'true');
        btn.querySelector('.evidence-caret').innerHTML = '&#9662;';
        sec.querySelector('.evidence-body').hidden = false;
      }
    });
  }

  function toggleEvidence(key, btn, forceOpen) {
    const body = btn.nextElementSibling;
    const expanded = btn.getAttribute('aria-expanded') === 'true';
    const open = forceOpen ? true : !expanded;
    btn.setAttribute('aria-expanded', String(open));
    body.hidden = !open;
    btn.querySelector('.evidence-caret').innerHTML = open ? '&#9662;' : '&#9656;';
    btn.classList.remove('is-glowing');
    const csNow = currentCase();
    if (csNow) {
      if (!state.ui.evidenceExpandedByCase[csNow.id]) state.ui.evidenceExpandedByCase[csNow.id] = new Set();
      const set = state.ui.evidenceExpandedByCase[csNow.id];
      if (open) set.add(key); else set.delete(key);
    }
    if (open && !expanded) {
      const cs = currentCase();
      if (!state.ui.evidenceOpenedByCase[cs.id]) state.ui.evidenceOpenedByCase[cs.id] = new Set();
      state.ui.evidenceOpenedByCase[cs.id].add(key);
      sfx('drawer');
      logEvent('evidence_open', { section: key });
      const a = state.assess[cs.id];
      const turn = currentTurn();
      if (a && turn) a.evidenceOpens.push({ turnId: turn.id, section: key, t: Date.now() });
      if (!state.ui.locked) disarmHesitation();
      if (!state.ui.evidenceLineFired && !state.ui.locked) {
        state.ui.evidenceLineFired = true;
        setOracleLine(oracleLineFor('on_evidence_open'));
      }
      refreshSubPanelLocks();
    }
  }

  function openEvidence(key) {
    const sec = $('evidenceList').querySelector(`.evidence-section[data-key="${key}"]`);
    if (!sec) return;
    const btn = sec.querySelector('.evidence-toggle');
    toggleEvidence(key, btn, true);
    btn.classList.add('is-glowing');
  }

  function evidenceOpened(key) {
    const set = state.ui.evidenceOpenedByCase[currentCase().id];
    if (!set) return false;
    if (key === 'any') return set.size > 0;
    return set.has(key);
  }

  // Unlock sections (make them visible) without opening them.
  function unlockEvidence(keys, turn) {
    const set = revealedSet(currentCase().id);
    const list = [].concat(keys || []);
    const fresh = list.filter((k) => !set.has(k));
    list.forEach((k) => set.add(k));
    if (fresh.length) sfx('unlock');
    renderEvidence(turn, fresh);
  }

  // Unlock and open (verify).
  function revealEvidence(keys, turn) {
    const set = revealedSet(currentCase().id);
    const list = [].concat(keys || []);
    list.forEach((k) => set.add(k));
    renderEvidence(turn);
    list.forEach((k) => openEvidence(k));
  }

  // =====================================================================
  // Meters
  // =====================================================================
  function renderMeters() {
    const list = $('meterList');
    list.innerHTML = "";
    Object.keys(METER_NAMES).forEach((key) => {
      const div = document.createElement('div');
      div.className = "meter";
      div.dataset.meter = key;
      div.innerHTML =
        `<button class="meter-toggle" type="button" aria-expanded="false" aria-label="${METER_NAMES[key]}, ${state.meters[key]}. Show what moved it.">` +
        `<div class="meter-label"><span><span class="meter-caret">&#9656;</span> ${METER_NAMES[key]}</span>` +
        `<span class="meter-value"><span class="meter-delta"></span><span class="meter-num">${state.meters[key]}</span></span></div>` +
        `<div class="meter-track"><div class="meter-fill" style="width:${meterWidth(state.meters[key])}%"></div></div>` +
        `</button>` +
        `<div class="meter-reason"></div>` +
        `<div class="meter-history-host" hidden></div>`;
      div.querySelector('.meter-toggle').addEventListener('click', () => toggleMeterHistory(key));
      list.appendChild(div);
    });
  }

  // A meter's own record: every change, with the reason that caused it and
  // the case it came from. The reason tag under the bar is a glimpse; this
  // is the whole account, and it is the assessment talking.
  function renderMeterHistory(key) {
    const host = $('meterList').querySelector(`.meter[data-meter="${key}"] .meter-history-host`);
    if (!host) return;
    const entries = state.meterLog[key] || [];
    if (!entries.length) {
      host.innerHTML = `<p class="meter-history-empty">Nothing has moved this yet.</p>`;
      return;
    }
    const rows = entries.map((e) => {
      const sign = e.delta > 0 ? "+" : "";
      const cls = e.delta > 0 ? "is-up" : "is-down";
      const where = e.caseName ? e.caseName.split(' ')[0] : "";
      return `<li><span class="mh-delta ${cls}">${sign}${e.delta}</span>` +
             `<span class="mh-reason">${renderMd(e.reason || "—")}</span>` +
             `<span class="mh-where">${where}</span></li>`;
    }).join("");
    host.innerHTML = `<ul class="meter-history">${rows}</ul>`;
  }

  function toggleMeterHistory(key) {
    const meter = $('meterList').querySelector(`.meter[data-meter="${key}"]`);
    if (!meter) return;
    const host = meter.querySelector('.meter-history-host');
    const btn = meter.querySelector('.meter-toggle');
    const open = host.hidden;
    host.hidden = !open;
    btn.setAttribute('aria-expanded', String(open));
    meter.querySelector('.meter-caret').innerHTML = open ? '&#9662;' : '&#9656;';
    if (open) {
      renderMeterHistory(key);
      logEvent('meter_history_open', { meter: key });
    }
  }

  function meterWidth(raw) {
    return clamp(50 + (raw - 50) * METER_SCALE, 0, 100);
  }

  async function applyEffects(effects, reasons) {
    if (!effects) return;
    const changed = Object.keys(effects).filter((k) => effects[k] && METER_NAMES[k]);
    for (const key of changed) {
      const delta = effects[key];
      state.meters[key] = clamp(state.meters[key] + delta, 0, 100);
      const el = $('meterList').querySelector(`.meter[data-meter="${key}"]`);
      el.querySelector('.meter-fill').style.width = meterWidth(state.meters[key]) + "%";
      el.querySelector('.meter-num').textContent = state.meters[key];
      const d = el.querySelector('.meter-delta');
      d.textContent = (delta > 0 ? "+" : "") + delta;
      d.className = "meter-delta is-shown " + (delta > 0 ? "is-up" : "is-down");
      const r = el.querySelector('.meter-reason');
      const reason = (reasons && reasons[key]) || "";
      const cs = currentCase();
      const turn = currentTurn();
      state.meterLog[key].push({
        delta, reason, value: state.meters[key],
        caseId: cs ? cs.id : null, caseName: cs ? cs.student.name : null,
        turnId: turn ? turn.id : null, t: Date.now()
      });
      if (reason) r.textContent = reason;
      r.classList.add('is-shown');
      sfx('tick', delta);
      announce(`${METER_NAMES[key]} ${delta > 0 ? "up" : "down"} ${Math.abs(delta)}${reason ? ", " + reason : ""}.`);
      // F7: the delta flash fades; the reason stays until this meter next
      // moves, because it is the most instructive string in the turn.
      setTimeout(() => { d.classList.remove('is-shown'); r.classList.remove('is-shown'); }, TIMING.REASON_TAG_MS);
      const host = el.querySelector('.meter-history-host');
      if (host && !host.hidden) renderMeterHistory(key);
      await wait(TIMING.METER_STAGGER_MS);
    }
    await wait(TIMING.METER_ANIM_MS);
  }

  // =====================================================================
  // Tags
  // =====================================================================
  function renderTags(turn) {
    const riskWrap = $('tagRisk');
    const issueWrap = $('tagIssue');
    if (turn.carryTags) {
      // Tags from the previous turn stay on screen, frozen.
      state.ui.tagsFrozen = true;
      $('tagRiskRow').hidden = false;
      $('tagIssueRow').hidden = !state.ui.riskTag;
      return;
    }
    state.ui.tagsFrozen = false;
    riskWrap.innerHTML = "";
    issueWrap.innerHTML = "";
    state.ui.riskTag = null;
    state.ui.issueTag = null;
    const tags = turn.tags;
    // Progressive disclosure: risk first, then issue, then interventions.
    $('tagRiskRow').hidden = !tags;
    $('tagIssueRow').hidden = true;
    if (!tags) return;
    const allowed = casePermissions(currentCase()).issues;
    state.ui.issueOptions = tags.issues.filter((i) => allowed.has(i));
    tags.risk.forEach((r) => riskWrap.appendChild(makeChip(CONTENT.ui.riskLabels[r] || r, () => selectTag('risk', r, riskWrap))));
    state.ui.issueOptions.forEach((i) => issueWrap.appendChild(makeChip(CONTENT.ui.issueLabels[i] || i, () => selectTag('issue', i, issueWrap))));
  }

  function makeChip(label, onClick) {
    const b = document.createElement('button');
    b.type = "button";
    b.className = "chip";
    b.textContent = label;
    b.addEventListener('click', onClick);
    return b;
  }

  function selectTag(kind, value, wrap) {
    if (state.ui.locked || state.ui.tagsFrozen) return;
    disarmHesitation();
    const turn = currentTurn();
    const idx = kind === 'risk' ? turn.tags.risk.indexOf(value) : state.ui.issueOptions.indexOf(value);
    Array.from(wrap.children).forEach((c, i) => c.classList.toggle('is-selected', i === idx));
    if (kind === 'risk') {
      state.ui.riskTag = value;
      logEvent('tag_risk', { value });
      sfx('chip');
      if (value === 'low' && turn.expert.risk === 'high') state.flags.underestimatedRisk = true;
      reveal($('tagIssueRow'));
    } else {
      state.ui.issueTag = value;
      logEvent('tag_issue', { value });
      sfx('chip');
    }
    if (tagsComplete() && $('subPanel').hidden) reveal($('interventionRow'));
    updateInterventionAvailability();
  }

  function tagsComplete() {
    const turn = currentTurn();
    if (!turn) return false;
    if (!turn.tags && !turn.carryTags) return true;
    if (turn.carryTags) return true;
    return !!(state.ui.riskTag && state.ui.issueTag);
  }

  // =====================================================================
  // Interventions
  // =====================================================================
  function renderInterventions(turn) {
    const row = $('interventionRow');
    row.innerHTML = "";
    $('interventionHint').textContent = "";
    if (turn.closing) { row.hidden = true; return; }
    if (turn.continueOnly) {
      const b = document.createElement('button');
      b.type = "button";
      b.className = "btn btn-primary btn-wide";
      b.dataset.kind = "continue";
      b.textContent = CONTENT.ui.continueLabel;
      b.addEventListener('click', onContinue);
      row.appendChild(b);
    } else {
      const allowed = casePermissions(currentCase()).interventions;
      INTERVENTION_ORDER.forEach((kind) => {
        if (!turn.interventions || !turn.interventions[kind] || !allowed.has(kind)) return;
        const b = document.createElement('button');
        b.type = "button";
        b.dataset.kind = kind;
        b.className = "btn" + (kind === 'send' ? " btn-primary" : "") + (kind === 'block' ? " btn-danger" : "");
        if (kind === 'send' || kind === 'block' || kind === 'verify') {
          b.classList.add('btn-hold');
          b.innerHTML = `${INTERVENTION_LABELS[kind]}<span class="btn-hint">hold</span>`;
          makeHoldButton(b, () => chooseIntervention(kind));
        } else {
          b.textContent = INTERVENTION_LABELS[kind];
          b.addEventListener('click', () => chooseIntervention(kind));
        }
        const hints = (CONTENT.ui && CONTENT.ui.interventionHints) || {};
        const showHint = () => { if (hints[kind]) $('interventionHint').textContent = hints[kind]; };
        const clearHint = () => { $('interventionHint').textContent = ""; };
        b.addEventListener('pointerenter', showHint);
        b.addEventListener('pointerleave', clearHint);
        b.addEventListener('focus', showHint);
        b.addEventListener('blur', clearHint);
        row.appendChild(b);
      });
    }
    // Revealed by selectTag once both tags are set (immediately if no tags).
    row.hidden = !tagsComplete();
    updateInterventionAvailability();
  }

  function updateInterventionAvailability() {
    const enabled = !state.ui.locked && tagsComplete();
    $('interventionRow').querySelectorAll('.btn').forEach((b) => { b.disabled = !enabled; });
    const chipsOff = state.ui.locked || state.ui.tagsFrozen;
    $('tagRisk').querySelectorAll('.chip').forEach((c) => { c.disabled = chipsOff; });
    $('tagIssue').querySelectorAll('.chip').forEach((c) => { c.disabled = chipsOff; });
  }

  function makeHoldButton(btn, onConfirm) {
    let timer = null;
    const start = (e) => {
      if (btn.disabled || timer) return;
      if (e.type === 'keydown') {
        if (e.repeat || (e.key !== 'Enter' && e.key !== ' ')) return;
        e.preventDefault();
      }
      btn.classList.add('is-holding');
      sfx('holding');
      timer = setTimeout(() => {
        timer = null;
        btn.classList.remove('is-holding');
        onConfirm();
      }, TIMING.HOLD_MS);
    };
    const cancel = () => {
      if (!timer) return;
      clearTimeout(timer);
      timer = null;
      btn.classList.remove('is-holding');
    };
    btn.addEventListener('pointerdown', start);
    btn.addEventListener('pointerup', cancel);
    btn.addEventListener('pointerleave', cancel);
    btn.addEventListener('pointercancel', cancel);
    btn.addEventListener('keydown', start);
    btn.addEventListener('keyup', cancel);
    btn.addEventListener('blur', cancel);
  }

  function chooseIntervention(kind) {
    if (state.ui.locked || !tagsComplete()) return;
    disarmHesitation();
    const turn = currentTurn();
    const spec = turn.interventions[kind];
    logEvent('intervention', { kind });
    switch (kind) {
      case 'send':
        release('send', spec, {});
        break;
      case 'block':
        release('block', spec, {});
        break;
      case 'revise':
        showOptionPanel('Revise — choose a rewrite', spec.options, 'revise', true);
        break;
      case 'qualify':
        showOptionPanel('Qualify — choose a qualifier', spec.options, 'qualify', true);
        break;
      case 'escalate':
        showEscalatePanel(spec);
        break;
      case 'verify':
        doVerify(spec);
        break;
    }
  }

  // Tags-only turn: record the classification and move on. No release.
  async function onContinue() {
    if (state.ui.locked || !tagsComplete()) return;
    disarmHesitation();
    const ep = state.ui.epoch;
    state.ui.locked = true;
    updateInterventionAvailability();
    $('interventionRow').hidden = true;
    logEvent('intervention', { kind: 'continue' });
    rollupTurn('continue', {}, { tagsOnly: true });
    addSystemLine(CONTENT.ui.systemLines.continue);
    setOracleLine(oracleLineFor('on_continue'));
    await wait(TIMING.CONTINUE_DELAY_MS);
    if (stale(ep)) return;
    advance();
  }

  let supportReturnFocus = null;
  let trapPanelId = 'supportPanel';
  function trapFocus(e) {
    const panel = $(trapPanelId);
    if (!panel || panel.hidden || e.key !== 'Tab') return;
    const items = panel.querySelectorAll('a[href], button:not([disabled])');
    if (!items.length) return;
    const first = items[0], last = items[items.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }

  function openSupport() {
    supportReturnFocus = document.activeElement;
    trapPanelId = 'supportPanel';
    $('supportPanel').hidden = false;
    $('supportClose').focus();
    document.addEventListener('keydown', trapFocus, true);
  }
  function closeSupport() {
    $('supportPanel').hidden = true;
    document.removeEventListener('keydown', trapFocus, true);
    if (supportReturnFocus && supportReturnFocus.focus) supportReturnFocus.focus();
  }

  let oracleReturnFocus = null;

  function oracleRead() {
    const C = CONTENT.oracleCard;
    const tint = computeTint();
    return (C.reads && (C.reads[tint] || C.reads.balanced)) || "";
  }

      `<circle class="glyph-ring-track" cx="20" cy="20" r="17"></circle>` +
      `<circle class="glyph-ring-fill" cx="20" cy="20" r="17"></circle>` +

  function lockHint(opt) {
    const label = opt.requires === 'any' ? "evidence" : (CONTENT.ui.evidenceLabels[opt.requires] || opt.requires);
    return `${label} not opened`;
  }

  function optionButton(opt, onSelect) {
    const b = document.createElement('button');
    b.type = "button";
    b.className = "btn btn-option";
    const locked = opt.requires && !evidenceOpened(opt.requires);
    b.innerHTML = `<span>${opt.label}</span>` + (locked ? `<span class="btn-hint">${lockHint(opt)}</span>` : "");
    b.disabled = !!locked;
    b.addEventListener('click', () => onSelect(opt));
    return b;

  function refreshSubPanelLocks() {
    if (!subPanelOptions) return;
    subPanelOptions.buttons.forEach(({ btn, opt }) => {
      const locked = opt.requires && !evidenceOpened(opt.requires);
      btn.disabled = !!locked;
      const hint = btn.querySelector('.btn-hint');
      if (!locked && hint) hint.remove();
    });

  function showOptionPanel(title, options, kind, allowBack, note) {
    const p = openSubPanel();
    const h = document.createElement('div');
    h.className = "sub-panel-title";
    h.textContent = title;
    p.appendChild(h);
    if (note) {
      const n = document.createElement('div');
      n.className = "sub-panel-note";
      n.textContent = note;
      p.appendChild(n);
    }
    const list = document.createElement('div');
    list.className = "option-list";
    const buttons = [];
    options.forEach((opt) => {
      const btn = optionButton(opt, (o) => {
        logEvent('subchoice', { kind, label: o.label });
        // `kind` is the intervention the player chose (e.g. verify) and is
        // what gets scored; `o.as` only changes how the release is rendered.
        release(o.as || kind, o, { optionLabel: o.label, fit: resolveText(o.fit), fitKind: kind });
      });
      list.appendChild(btn);
      buttons.push({ btn, opt });
    });
    p.appendChild(list);
    if (allowBack) {
      const actions = document.createElement('div');
      actions.className = "sub-panel-actions";
      const back = document.createElement('button');
      back.type = "button";

      back.textContent = "Back";
      back.addEventListener('click', () => { logEvent('subchoice', { kind, label: '(back)' }); clearSubPanel(); });
      actions.appendChild(back);
      p.appendChild(actions);

    subPanelOptions = { options, kind, buttons };

    confirm.className = "btn";

      logEvent('subchoice', { kind: 'escalate', label: 'confirm' });
      release('escalate', spec, {});

  async function doVerify(spec) {
    const ep = state.ui.epoch;
    const turn = currentTurn();
    state.ui.locked = true;
    updateInterventionAvailability();
    $('interventionRow').hidden = true;
    addSystemLine(spec.systemLine || CONTENT.ui.systemLines.verify);
    if (spec.reveals) revealEvidence(spec.reveals, turn);
    setFlags(spec.setFlags);
    setOracleLine(oracleLineFor('on_verify', spec.oracleLine));
    // The cost of checking: the student may nudge, and a meter may move.
    const nudge = resolveText(spec.nudge);
    if (nudge && nudge.text) {
      await wait(TIMING.NUDGE_DELAY_MS);
      if (stale(ep)) return;
      addStudentMessage(nudge.text, nudge.time);
      logEvent('nudge', { text: nudge.text });
    }
    const verifyEffects = resolveText(spec.effects);
    if (verifyEffects) await applyEffects(verifyEffects, resolveText(spec.reasons));
    if (stale(ep)) return;
    state.ui.locked = false;
    const revealedLabel = [].concat(spec.reveals || []).map((k) => CONTENT.ui.evidenceLabels[k] || k).join(", ");
    showOptionPanel(`Verified: ${revealedLabel || "records"} — then`, spec.thenOptions || [], 'verify', false);
    // A second chance to hesitate: the check is done, the follow-through isn't.
    state.ui.hesitationFired = false;
    armHesitation();
    // Verified turns cannot go back to the plain draft: the check is logged
    // and the intervention is committed. Only the follow-through remains.
  }

  // =====================================================================
  // Release: the moment a decision leaves the Layer
  // =====================================================================
  function updateDraftBlock(kind, outcome) {
    const block = state.ui.draftBlock;
    if (!block) return;
    const body = block.querySelector('.msg-body');
    const stateEl = block.querySelector('.msg-state');
    block.classList.remove('is-released', 'is-blocked', 'is-held');
    if (kind === 'block') {
      block.classList.add('is-blocked');
      stateEl.textContent = "draft · blocked";
    } else if (kind === 'escalate') {
      block.classList.add('is-held');
      stateEl.textContent = "draft · held · handoff";
    } else {
      block.classList.add('is-released');
      const text = resolveText(outcome.text);
      if (text) body.innerHTML = renderMd(text);
      const tag = kind === 'revise' ? "revised by layer · released"
        : kind === 'qualify' ? "qualified by layer · released"
        : "released";
      stateEl.textContent = tag;
    }
  }

  async function release(kind, outcome, ctx) {
    const ep = state.ui.epoch;
    const turn = currentTurn();
    const cs = currentCase();
    state.ui.locked = true;
    disarmHesitation();
    updateInterventionAvailability();
    $('subPanel').hidden = true;
    $('interventionRow').hidden = true;
    setOracleLine("");
    logEvent('release', { kind, option: ctx.optionLabel || null });

    duckMusic();
    updateDraftBlock(kind, outcome);
    addSystemLine(outcome.systemLine || CONTENT.ui.systemLines[kind]);
    // Released brightens once; held / blocked / escalated dims once.
    const heldKind = kind === 'block' || kind === 'escalate';
    sfx(heldKind ? 'hold' : 'release');
    flashGlyph(heldKind ? 'is-held' : 'is-released');

    // Silence. The ring breathes.
    const pauseMs = turn.expert && turn.expert.risk === 'high' ? TIMING.RELEASE_PAUSE_HIGH_MS : TIMING.RELEASE_PAUSE_MS;
    await wait(pauseMs);
    if (stale(ep)) return;

    await applyEffects(resolveText(outcome.effects), resolveText(outcome.reasons));
    if (stale(ep)) return;
    setFlags(outcome.setFlags);
    if (outcome.recovery) {
      state.flags.recovered = true;
      logEvent('recovery', { kind, option: ctx.optionLabel || null });
    }
    const vk = resolveText(outcome.vignetteKey);
    if (vk) state.vignettes[cs.id] = vk;
    rollupTurn(kind, outcome, ctx);
    // Two or more over-interventions is the pattern the debrief names. From
    // that point the content can read it as a flag (REVIEW.md §18): one hold
    // in one case no longer rewrites another student's ending on its own.
    if (!state.flags.overIntervention) {
      const overs = Object.keys(state.assess).reduce((n, id) => n + (state.assess[id].overIntervention || 0), 0);
      if (overs >= 2) {
        state.flags.overIntervention = true;
        logEvent('over_intervention', { count: overs });
      }
    }
    setOracleLine(oracleLineFor('on_' + kind, outcome.oracleLine));

    const reply = resolveText(outcome.studentReply);
    if (reply) {
      await wait(TIMING.REPLY_DELAY_MS);
      if (stale(ep)) return;
      addStudentMessage(reply, resolveText(outcome.replyTime), resolveText(outcome.replySpeaker));
      logEvent('reply_shown', { text: reply });
    }
    if (outcome.systemLineAfter) {
      await wait(TIMING.LINE_DELAY_MS);
      if (stale(ep)) return;
      addSystemLine(outcome.systemLineAfter, true);
    }
    if (outcome.oracleAfterReply) {
      await wait(TIMING.LINE_DELAY_MS);
      if (stale(ep)) return;
      setOracleLine(resolveText(outcome.oracleAfterReply));
    }
    if (turn.failSafe && checkMeterLeak(turn.failSafe)) {
      logEvent('fail_safe', { meter: turn.failSafe.meter, value: state.meters[turn.failSafe.meter] });
    }

    state.ui.lastKind = kind;
    unduckMusic();
    await wait(TIMING.NEXT_TURN_DELAY_MS);
    if (stale(ep)) return;
    advance();
  }

  // =====================================================================
  // Assessment rollups (stealth data, PLAN.md §5)
  // =====================================================================
  function ensureAssess(caseId) {
    if (!state.assess[caseId]) {
      state.assess[caseId] = { turns: [], evidenceOpens: [], recovery: false, overIntervention: 0, underIntervention: 0 };
    }
    return state.assess[caseId];
  }

  function rollupTurn(kind, outcome, ctx) {
    const turn = currentTurn();
    const ex = turn.expert || {};
    const a = ensureAssess(currentCase().id);
    const hasTags = !!(turn.tags || turn.carryTags);
    const rec = {
      turnId: turn.id,
      riskTag: state.ui.riskTag,
      issueTag: state.ui.issueTag,
      riskAccuracy: hasTags ? state.ui.riskTag === ex.risk : null,
      issueAccuracy: hasTags ? state.ui.issueTag === ex.issue : null,
      issuePartial: hasTags ? !!(ex.partialIssues && ex.partialIssues.includes(state.ui.issueTag)) : null,
      intervention: kind,
      releasedAs: kind,
      option: ctx.optionLabel || null,
      interventionFit: null,
      underIntervention: false,
      overIntervention: false,
      recovery: false,
      decisionTimeMs: state.ui.draftShownAt ? Date.now() - state.ui.draftShownAt : null
    };
    if (!ctx.tagsOnly) {
      const fitMap = ex.interventionFit || {};
      const chosen = ctx.fitKind || kind;
      const fit = (ctx.fit != null) ? ctx.fit : (fitMap[chosen] != null ? fitMap[chosen] : 0);
      // Under: a weak intervention where the expert rated risk high.
      // Over: a hold (block/escalate) the expert rated as poor fit or
      // applied to a low-risk case, or a check (verify) with nothing to
      // find — over-checking is a failure mode too.
      const under = ex.risk === 'high' && fit <= 1;
      const over = ((chosen === 'block' || chosen === 'escalate') && (ex.risk === 'low' || fit <= 1))
        || (chosen === 'verify' && fit <= 1);
      rec.intervention = chosen;
      rec.interventionFit = fit;
      rec.underIntervention = under;
      rec.overIntervention = over;
      rec.recovery = !!outcome.recovery;
      if (under) a.underIntervention += 1;
      if (over) a.overIntervention += 1;
      if (outcome.recovery) a.recovery = true;
    }
    a.turns.push(rec);
  }

  function shiftRollup() {
    const cases = Object.keys(state.assess);
    const sum = (k) => cases.reduce((n, id) => n + (state.assess[id][k] || 0), 0);
    const allTurns = cases.flatMap((id) => state.assess[id].turns);
    const tagged = allTurns.filter((t) => t.riskAccuracy !== null);
    return {
      overIntervention: sum('overIntervention'),
      underIntervention: sum('underIntervention'),
      recovery: !!state.flags.recovered,
      compounded: !!state.flags.compounded,
      riskAccuracy: tagged.length ? tagged.filter((t) => t.riskAccuracy).length / tagged.length : null,
      issueAccuracy: tagged.length ? tagged.filter((t) => t.issueAccuracy).length / tagged.length : null,
      // Distinct sections, not raw clicks (F3): re-opening a section the
      // drawer closed on its own never meant a second act of checking.
      evidenceOpens: cases.reduce((n, id) => n + new Set(state.assess[id].evidenceOpens.map((e) => e.section)).size, 0),
      evidenceOpensRaw: cases.reduce((n, id) => n + state.assess[id].evidenceOpens.length, 0),
      pattern: computePattern()
    };
  }

  // A composed rule is a claim about how the player worked. These are the
  // facts it gets checked against: counted from the same log the debrief
  // quotes, so the answer is the record rather than an opinion.
  function ruleCheck(id) {
    const f = state.flags;
    const turns = Object.keys(state.assess).flatMap((cid) => state.assess[cid].turns);
    const released = turns.filter((t) => t.intervention && t.intervention !== 'continue');
    const opensByCase = {};
    Object.keys(state.assess).forEach((cid) => {
      opensByCase[cid] = new Set(state.assess[cid].evidenceOpens.map((e) => e.section));
    });
    const turnMeta = (turnId) => {
      for (const cs of CONTENT.cases) {
        const t = cs.turns.find((x) => x.id === turnId);
        if (t) return { turn: t, caseId: cs.id };
      }
      return null;
    };

    switch (id) {
      case 'verify': {
        const claimTurns = released.filter((t) => {
          const m = turnMeta(t.turnId);
          return m && m.turn.expert && m.turn.expert.issue === 'unsupported_claim';
        });
        const checked = claimTurns.filter((t) => {
          const m = turnMeta(t.turnId);
          return t.intervention === 'verify' || (m && opensByCase[m.caseId] && opensByCase[m.caseId].size > 0);
        });
        if (!claimTurns.length) return { none: true };
        return { kept: checked.length >= Math.ceil(claimTurns.length / 2), n: checked.length, m: claimTurns.length };
      }
      case 'confidence': {
        const hot = released.filter((t) => {
          const m = turnMeta(t.turnId);
          const conf = m && m.turn.draft ? resolveText(m.turn.draft.confidence) : 0;
          return conf >= 90 && t.intervention !== 'block' && t.intervention !== 'escalate';
        });
        if (!hot.length) return { none: true };
        const blind = hot.filter((t) => {
          const m = turnMeta(t.turnId);
          return !(m && opensByCase[m.caseId] && opensByCase[m.caseId].size);
        });
        return { kept: blind.length === 0, n: blind.length === 0 ? hot.length : blind.length, m: hot.length };
      }
      case 'choice': {
        const holds = released.filter((t) => t.intervention === 'block' || t.intervention === 'escalate').length;
        return { kept: state.meters.autonomy >= 52 && holds <= 2, n: state.meters.autonomy, m: holds };
      }
      case 'uncertainty': {
        const q = released.filter((t) => t.intervention === 'qualify').length;
        return { kept: q >= 2, n: q, m: released.length };
      }
      case 'person': {
        // Counting escalations alone was wrong: on most high-risk turns the
        // calibrated move puts a person within reach without handing off
        // (an aid office, ISS, the 24/7 line). The measure is whether the
        // distress turn was met, plus how often a handoff was used at all.
        const handoffs = released.filter((t) => t.intervention === 'escalate').length;
        const metSafety = !!(f.calibratedSafety || f.resourcesGiven || f.resourcesAppended || f.escalatedSafety);
        const pointed = !!(f.faFirst || f.amaraInformed || f.amaraRecovered || f.escalatedEarly);
        if (f.missedSafety) return { kept: false, safety: true, n: handoffs, m: 0 };
        return { kept: metSafety, n: handoffs, m: pointed ? 1 : 0 };
      }
      case 'missing': {
        let available = 0;
        CONTENT.cases.forEach((cs) => {
          const keys = new Set(Object.keys(cs.evidence || {}));
          cs.turns.forEach((t) => Object.keys(t.evidence || {}).forEach((k) => keys.add(k)));
          available += keys.size;
        });
        const opened = Object.keys(opensByCase).reduce((n, cid) => n + opensByCase[cid].size, 0);
        return { kept: available > 0 && opened / available >= 0.5, n: opened, m: available };
      }
      case 'slow': {
        const sends = released.filter((t) => t.intervention === 'send' && t.decisionTimeMs != null);
        if (!sends.length) return { none: true };
        const fastest = sends.reduce((a, b) => (a.decisionTimeMs < b.decisionTimeMs ? a : b));
        const secs = Math.max(1, Math.round(fastest.decisionTimeMs / 1000));
        const m = turnMeta(fastest.turnId);
        const conf = m && m.turn.draft ? resolveText(m.turn.draft.confidence) : 0;
        return { kept: secs >= 12, n: secs, m: conf };
      }
      case 'own': {
        if (!f.recovered && !f.compounded && !f.sentUnverified && !f.amaraDropped && !f.c0_sentWrongDate) return { none: true };
        return { kept: !!f.recovered && !f.compounded, n: 0, m: 0 };
      }
    }
    return { none: true };
  }

  function computePattern() {
    const cases = Object.keys(state.assess);
    const sum = (k) => cases.reduce((n, id) => n + (state.assess[id][k] || 0), 0);
    if (state.flags.recovered && !state.flags.compounded) return "recovery";
    if (sum('overIntervention') >= 2) return "over";
    if (sum('underIntervention') >= 2) return "under";
    return "calibrated";
  }

  function buildExport() {
    return {
      session: state.session,
      exportedAt: new Date().toISOString(),
      meters: state.meters,
      flags: state.flags,
      vignettes: state.vignettes,
      rule: state.rule,
      rollup: shiftRollup(),
      meterLog: state.meterLog,
      assess: state.assess,
      log: state.log
    };
  }

  // Export hooks for playtesting.
  window.__oracleExport = function () { return JSON.stringify(buildExport(), null, 2); };

  function downloadExport() {
    const blob = new Blob([window.__oracleExport()], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `oracle_layer_${state.session}_${Date.now()}.json`;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    logEvent('export', {});
  }

  // Latest export under STORAGE_KEY; every run appended to STORAGE_RUNS,
  // keyed by session so re-persisting the same run replaces its entry
  // rather than duplicating it. Earlier runs are never overwritten.
  function persist() {
    const data = buildExport();
    writeStore(STORAGE_KEY, data);
    const runs = readStore(STORAGE_RUNS, []);
    const list = Array.isArray(runs) ? runs : [];
    const idx = list.findIndex((r) => r && r.session === data.session);
    if (idx >= 0) list[idx] = data; else list.push(data);
    writeStore(STORAGE_RUNS, list);
  }

  window.__oracleRuns = function () { return readStore(STORAGE_RUNS, []); };

  // Plain-text Calibrated Review Profile, for pasting into a submission.
  function profileText() {
    const D = CONTENT.debrief;
    const U = CONTENT.ui;
    const pattern = computePattern();
    const lines = [];
    lines.push(U.profileTitle);
    lines.push(`Session ${state.session} · Shift 01 · ${new Date().toISOString().slice(0, 10)}`);
    lines.push("");
    lines.push(`PATTERN: ${D.patternLabels[pattern]}`);
    lines.push(D.patterns[pattern]);
    lines.push("");
    lines.push("METERS");
    Object.keys(METER_NAMES).forEach((key) => {
      const v = state.meters[key];
      lines.push(`${METER_NAMES[key]}: ${v} — ${D.meterLines[key][meterBand(v)]}`);
    });
    lines.push("");
    lines.push("MOMENTS");
    const moments = computeMoments();
    if (moments.length) moments.forEach((m) => lines.push(`- ${m.replace(/\*/g, '')}`));
    else lines.push("- (none logged)");
    lines.push("");
    lines.push("THE RULE");
    if (state.rule) {
      lines.push(state.rule.criteria.join(" · "));
      if (state.rule.text) lines.push(`"${state.rule.text}"`);
      if (state.rule.against) {
        lines.push("");
        lines.push("AGAINST THE RECORD");
        state.rule.against.forEach((a) => {
          const c = D.ruleCriteria.find((x) => x.id === a.id);
          const r = a.check || {};
          if (!c) return;
          const tpl = r.none ? (c.none || "") : (r.kept ? c.kept : (r.safety && c.safetyBroke ? c.safetyBroke : c.broke));
          lines.push(`- ${c.label}: ${r.none ? "—" : (r.kept ? D.ruleKept : D.ruleBroke)}. ${String(tpl).replace('{n}', r.n).replace('{m}', r.m)}`);
        });
      }
    } else {
      lines.push(U.ruleNotRecorded);
    }
    lines.push("");
    lines.push(U.closingLine);
    return lines.join("\n");
  }

  async function copyProfile(statusEl, fallbackHost) {
    const text = profileText();
    logEvent('profile_copy', { chars: text.length });
    try {
      if (!navigator.clipboard || !navigator.clipboard.writeText) throw new Error('no clipboard api');
      await navigator.clipboard.writeText(text);
      statusEl.textContent = CONTENT.ui.copied;
      return true;
    } catch (e) {
      statusEl.textContent = CONTENT.ui.copyFailed;
      let ta = fallbackHost.querySelector('.copy-fallback');
      if (!ta) {
        ta = document.createElement('textarea');
        ta.className = 'copy-fallback';
        ta.readOnly = true;
        fallbackHost.appendChild(ta);
      }
      ta.value = text;
      ta.focus();
      ta.select();
      return false;
    }
  }

  // Replay: bump the session counter and reload from the boot sequence.
  // A reload is the only reset that is guaranteed complete: timers,
  // closures, DOM, and animation state all go.
  function beginNewShift() {
    persist();
    const n = readStore(STORAGE_SESSION, FIRST_SESSION_NO);
    writeStore(STORAGE_SESSION, (Number(n) || FIRST_SESSION_NO) + 1);
    logEvent('new_shift', { from: state.session });
    location.reload();
  }

  function initSession() {
    const n = Number(readStore(STORAGE_SESSION, FIRST_SESSION_NO)) || FIRST_SESSION_NO;
    state.session = sessionName(n);
    state.prevSession = sessionName(n - 1);
    state.replay = n > FIRST_SESSION_NO;
  }

  // =====================================================================
  // Turn / case flow
  // =====================================================================
  function startCase() {
    const cs = currentCase();
    state.turnIndex = 0;
    state.ui.caseStatus[cs.id] = "active";
    if (state.ui.queueVisible < state.caseIndex + 1) state.ui.queueVisible = state.caseIndex + 1;
    scheduleQueueGrowth();
    ensureAssess(cs.id);
    logEvent('case_open', { student: cs.student.name });
    sfx('caseOpen');
    const prev = state.caseIndex > 0 ? casePermissions(CONTENT.cases[state.caseIndex - 1]) : null;
    if (permissionsExpanded(prev, casePermissions(cs))) {
      state.ui.pendingCaseLine = oracleLineFor('on_permissions_expanded');
      logEvent('permissions_expanded', { interventions: [...casePermissions(cs).interventions] });
    }
    renderQueue();
    $('threadMessages').innerHTML = "";
    state.ui.liveThreadHtml = "";
    $('threadControls').hidden = false;
    startTurn();
  }

  async function startTurn() {
    const ep = ++state.ui.epoch;
    const turn = currentTurn();
    const reuse = !!(turn.draft && turn.draft.reuse);
    state.ui.locked = true;
    disarmHesitation();
    state.ui.hesitationFired = false;
    applyTint();
    state.ui.evidenceLineFired = false;
    if (!reuse) state.ui.draftBlock = null;
    clearSubPanel();
    setOracleLine(state.ui.pendingCaseLine || "");
    state.ui.pendingCaseLine = null;
    if (!reuse) setConfidence(null);
    if (turn.unlocks) unlockEvidence(turn.unlocks, turn); else renderEvidence(turn);
    renderTags(turn);
    renderInterventions(turn);
    updateInterventionAvailability();
    if (turn.startLeak) checkMeterLeak(turn.startLeak);

    if (turn.systemLine) {
      addSystemLine(resolveText(turn.systemLine), true);
      await wait(TIMING.LINE_DELAY_MS);
      if (stale(ep)) return;
    }

    if (turn.closing) { await runClosingTurn(turn, ep); return; }

    const studentText = resolveText(turn.student);
    if (studentText) {
      addStudentMessage(studentText, turn.time);
      logEvent('student_shown', {});
      const extra = turn.studentExtra ? resolveText(turn.studentExtra) : null;
      if (extra) {
        await wait(TIMING.STUDENT_EXTRA_DELAY_MS);
        if (stale(ep)) return;
        addStudentMessage(extra, turn.timeExtra || null);
        logEvent('student_shown', { extra: true });
      }
      await wait(TIMING.DRAFT_DELAY_MS);
    } else {
      await wait(TIMING.DRAFT_DELAY_MS / 2);
    }
    if (stale(ep)) return;

    const confidence = resolveText(turn.draft.confidence);
    if (reuse && state.ui.draftBlock) {
      setConfidence(confidence);
      logEvent('draft_shown', { confidence, reuse: true });
    } else {
      const text = resolveText(turn.draft.text);
      const block = addDraftBlock(confidence);
      state.ui.draftBlock = block;
      logEvent('draft_shown', { confidence });
      if (reuse) {
        // Debug jump into a reuse turn with no prior draft: show it whole.
        block.querySelector('.msg-body').innerHTML = renderMd(text);
        setConfidence(confidence);
      } else {
        await streamDraft(block, text, confidence);
        if (stale(ep)) return;
      }
    }
    state.ui.draftShownAt = Date.now();
    setOracleLine(oracleLineFor('on_draft', turn.draft.oracleLine));
    state.ui.locked = false;
    updateInterventionAvailability();
    if (tagsComplete()) reveal($('interventionRow'));
    armHesitation();

    // Oracle's one teaching line: once per shift, a few seconds after the
    // on_draft line, and only if the player hasn't already found the drawer.
    if (turn.draft.oracleFollowUp && !state.ui.teachLineFired) {
      state.ui.teachLineFired = true;
      setTimeout(() => {
        if (!stale(ep) && !state.ui.locked && !state.ui.evidenceLineFired) setOracleLine(turn.draft.oracleFollowUp);
      }, TIMING.TEACH_LINE_DELAY_MS);
    }
  }

  // Closing turn: no draft, no intervention. A message chosen by pattern.
  async function runClosingTurn(turn, ep) {
    const cs = currentCase();
    const r = turn.resolve(state) || {};
    $('tagRiskRow').hidden = true;
    $('tagIssueRow').hidden = true;
    setConfidence(null);
    await wait(TIMING.CLOSING_DELAY_MS);
    if (stale(ep)) return;
    if (r.student) {
      addStudentMessage(r.student, r.time, r.speaker);
      logEvent('reply_shown', { text: r.student, closing: true });
    } else if (r.systemLine) {
      addSystemLine(r.systemLine, true);
      logEvent('closing_silence', {});
    }
    if (r.vignetteKey) state.vignettes[cs.id] = r.vignetteKey;
    logEvent('case_resolution', { vignetteKey: r.vignetteKey || null });
    if (r.oracleLine) {
      await wait(TIMING.LINE_DELAY_MS);
      if (stale(ep)) return;
      setOracleLine(r.oracleLine);
    }
    await wait(TIMING.CLOSING_HOLD_MS);
    if (stale(ep)) return;
    advance();
  }

  // =====================================================================
  // Reading a closed case again (F8). Read-only: the thread as it stood,
  // no controls, no way to intervene twice. Deliberating over a case you
  // already released is the behaviour this game is about, so it is logged.
  // =====================================================================
  function openCaseReview(caseId, from) {
    const cs = CONTENT.cases.find((c) => c.id === caseId);
    const html = state.ui.threadHtml[caseId];
    if (!cs || !html) return;
    if (!state.ui.reviewingCaseId) {
      state.ui.liveThreadHtml = $('threadMessages').innerHTML;
      state.ui.reviewReturn = from || 'console';
    }
    state.ui.reviewingCaseId = caseId;
    disarmHesitation();
    if (state.ui.reviewReturn === 'debrief') hideScreens();
    $('threadMessages').innerHTML = html;
    $('threadControls').hidden = true;
    const banner = $('reviewBanner');
    const U = CONTENT.ui;
    banner.innerHTML =
      `<span>${(U.reviewLabel || "Reading")} · ${cs.student.name}</span>` +
      `<button class="btn btn-ghost" type="button" id="reviewClose">${U.reviewClose || "Back"}</button>`;
    banner.hidden = false;
    $('reviewClose').addEventListener('click', closeCaseReview);
    $('reviewClose').focus();
    renderQueue();
    logEvent('case_review_open', { caseId, from: state.ui.reviewReturn });
    announce(`Reading ${cs.student.name} again.`);
    scrollThread();
  }

  function closeCaseReview() {
    if (!state.ui.reviewingCaseId) return;
    const from = state.ui.reviewReturn;
    logEvent('case_review_close', { caseId: state.ui.reviewingCaseId });
    state.ui.reviewingCaseId = null;
    state.ui.reviewReturn = null;
    $('reviewBanner').hidden = true;
    $('reviewBanner').innerHTML = "";
    if (from === 'debrief') {
      showScreen('screenDebrief');
    } else {
      $('threadMessages').innerHTML = state.ui.liveThreadHtml || "";
      $('threadControls').hidden = state.ui.shiftEnded;
      if (!state.ui.locked) armHesitation();
      scrollThread();
    }
    renderQueue();
  }

  function advance() {
    const cs = currentCase();
    const turn = currentTurn();
    let nextId = typeof turn.next === 'function' ? turn.next(state) : turn.next;
    if (nextId === undefined) {
      const following = cs.turns[state.turnIndex + 1];
      nextId = following ? following.id : "end";
    }
    if (nextId === "end") { endCase(); return; }
    const idx = cs.turns.findIndex((t) => t.id === nextId);
    if (idx < 0) { endCase(); return; }
    state.turnIndex = idx;
    startTurn();
  }

  async function endCase() {
    const ep = state.ui.epoch;
    const cs = currentCase();
    // Keep the thread so the queue and the debrief can reopen it (F8).
    state.ui.threadHtml[cs.id] = $('threadMessages').innerHTML;
    const held = state.ui.lastKind === 'block' || state.ui.lastKind === 'escalate';
    state.ui.caseStatus[cs.id] = held ? "held" : "released";
    logEvent('case_close', { status: state.ui.caseStatus[cs.id], vignetteKey: state.vignettes[cs.id] || null });
    renderQueue();
    state.ui.locked = true;
    disarmHesitation();
    updateInterventionAvailability();
    $('interventionRow').hidden = true;
    if (cs.closingOracleLine) setOracleLine(resolveText(cs.closingOracleLine));
    if (cs.leakAfter) showLogLeak(leakText(cs.leakAfter));

    if (CONTENT.cases[state.caseIndex + 1]) {
      await wait(TIMING.CASE_GAP_MS);
      if (stale(ep)) return;
      state.caseIndex += 1;
      startCase();
      return;
    }
    // End of the shift.
    $('tagRiskRow').hidden = true;
    $('tagIssueRow').hidden = true;
    setConfidence(null);
    addSystemLine(CONTENT.ui.systemLines.shiftEnd);
    sfx('shiftEnd');
    await wait(TIMING.SHIFT_END_DELAY_MS);
    if (stale(ep)) return;
    endShift();
  }

  // =====================================================================
  // End of shift: vignettes → debrief
  // =====================================================================
  function showScreen(id) {
    $('console').hidden = true;
    $('screenVignettes').hidden = id !== 'screenVignettes';
    $('screenDebrief').hidden = id !== 'screenDebrief';
    $(id).scrollTop = 0;
    // F9: focus followed the hidden console otherwise, so keyboard and
    // screen-reader players lost their place at every transition.
    const el = $(id);
    const heading = el.querySelector('.doc-kicker, .doc-title, h1, h2');
    const target = heading || el;
    target.setAttribute('tabindex', '-1');
    setTimeout(() => { try { target.focus({ preventScroll: true }); } catch (e) {} }, 60);
  }

  function hideScreens() {
    $('screenVignettes').hidden = true;
    $('screenDebrief').hidden = true;
    $('console').hidden = false;
  }

  function endShift() {
    state.ui.shiftEnded = true;
    setMusicLevel(MUSIC.screen, TIMING.MUSIC_FADE_MS);
    disarmHesitation();
    if (state.ui.queueTimer) { clearTimeout(state.ui.queueTimer); state.ui.queueTimer = null; }
    logEvent('shift_end', { meters: Object.assign({}, state.meters) });
    persist();
    renderVignettes();
    showScreen('screenVignettes');
  }

  function renderVignettes() {
    const el = $('screenVignettes');
    const cards = CONTENT.cases.map((cs) => {
      const key = state.vignettes[cs.id];
      const text = (key && CONTENT.vignettes[key]) || "";
      return `<div class="card"><p class="card-name">${cs.vignetteName || cs.student.name}</p><p>${renderMd(text)}</p></div>`;
    }).join("");
    el.innerHTML =
      `<div class="doc">` +
      `<p class="doc-kicker">${CONTENT.ui.vignettesTitle}</p>` +
      `<div class="cards">${cards}</div>` +
      `<div class="doc-actions"><button class="btn btn-primary" type="button" id="toDebrief">${CONTENT.ui.vignettesContinue}</button></div>` +
      `</div>`;
    $('toDebrief').addEventListener('click', () => {
      logEvent('vignettes_continue', {});
      showLogLeak(leakText('beforeDebrief'));
      renderDebrief();
      showScreen('screenDebrief');
    });
  }

  function meterBand(v) { return v < 45 ? "low" : (v > 55 ? "high" : "mid"); }

  // Moments quoted back from the log. Ordered by priority; the first
  // three that apply are shown.
  function computeMoments() {
    const M = CONTENT.debrief.moments;
    const f = state.flags;
    const a1 = state.assess.c1;
    const a0 = state.assess.c0;
    const a2 = state.assess.c2;
    const a3 = state.assess.c3;
    const a4 = state.assess.c4;
    const out = [];
    const turnIn = (a, id, test) => !!(a && a.turns.some((t) => t.turnId === id && test(t)));
    const c1t4 = a1 && a1.turns.find((t) => t.turnId === 'c1t4');
    if (f.missedSafety && c1t4) out.push(c1t4.intervention === 'block' ? M.missedSafetyBlock : M.missedSafetySend);
    if (f.calibratedSafety) out.push(M.calibratedSafety);
    if (f.escalatedSafety) out.push(M.escalatedSafety);
    if (f.recovered) out.push(M.recovered);
    if (f.compounded) out.push(M.compounded);
    if (f.leakedToInstructor) out.push(M.disclosureReleased);
    else if (f.c5_declined) out.push(M.disclosureHeld);
    if (f.amaraDropped) out.push(M.amaraUnverified);
    else if (turnIn(a4, 'c4t1', (t) => t.intervention === 'verify' || t.intervention === 'qualify')) out.push(M.amaraChecked);
    if (f.c3_duplicateSent) out.push(M.theoDuplicate);
    else if (turnIn(a3, 'c3t1', (t) => t.intervention === 'send' && t.interventionFit === 3)) out.push(M.theoTrusted);
    if (a1 && a1.turns.filter((t) => t.intervention === 'block').length >= 2) out.push(M.heldTwice);
    if (a1 && a1.turns.some((t) => t.turnId === 'c1t3a' && t.intervention === 'verify' && t.interventionFit <= 1)) out.push(M.checkedTwice);
    if (a1 && a1.turns.some((t) => t.turnId === 'c1t4' && t.intervention === 'verify')) out.push(M.checkedDistress);
    if (f.sentUnverified) out.push(M.sentUnverified);
    if (a1) {
      const early = a1.evidenceOpens.find((e) => e.turnId === 'c1t1' || e.turnId === 'c1t2');
      if (early) out.push(M.openedBeforeRelease.replace('{section}', (CONTENT.ui.evidenceLabels[early.section] || early.section).toLowerCase()));
    }
    if (a2 && a2.turns[0] && (a2.turns[0].intervention === 'verify' || a2.turns[0].intervention === 'qualify')) out.push(M.priyaChecked);
    if (a0 && a0.turns[0] && a0.turns[0].intervention === 'verify') out.push(M.c0verify);
    const releases = Object.keys(state.assess).flatMap((id) => state.assess[id].turns)
      .filter((t) => t.intervention === 'send' && t.decisionTimeMs != null);
    if (releases.length) {
      const secs = Math.max(1, Math.round(Math.min(...releases.map((t) => t.decisionTimeMs)) / 1000));
      out.push(M.fastest.replace('{time}', `${secs} ${secs === 1 ? M.second : M.seconds}`));
    }
    return out.slice(0, 4);
  }

  function renderDebrief() {
    const D = CONTENT.debrief;
    const U = CONTENT.ui;
    const pattern = computePattern();
    const el = $('screenDebrief');
    const meters = Object.keys(METER_NAMES).map((key) => {
      const v = state.meters[key];
      return `<div class="debrief-meter">` +
        `<div class="meter-label"><span>${METER_NAMES[key]}</span><span class="meter-value">${v}</span></div>` +
        `<div class="meter-track"><div class="meter-fill" style="width:${meterWidth(v)}%"></div></div>` +
        `<p class="meter-sentence">${D.meterLines[key][meterBand(v)]}</p>` +
        `</div>`;
    }).join("");
    const moments = computeMoments().map((m) => `<li>${renderMd(m)}</li>`).join("");
    const chips = D.ruleCriteria.map((c, i) => `<button class="chip" type="button" data-idx="${i}">${c.label}</button>`).join("");

    el.innerHTML =
      `<div class="doc">` +
      `<p class="doc-kicker">${U.debriefTitle}</p>` +
      `<h1 class="doc-title">${U.debriefAddressed} ${state.session}</h1>` +
      `<p class="doc-sub">shift 01 · ${CONTENT.cases.length} cases · ${state.log.length} events logged</p>` +

      `<section class="doc-section"><h2 class="doc-section-title">${U.debriefSections.pattern}</h2>` +
      `<p class="pattern-label">${D.patternLabels[pattern]}</p><p>${D.patterns[pattern]}</p></section>` +

      `<section class="doc-section"><h2 class="doc-section-title">${U.debriefSections.meters}</h2>` +
      `<div class="debrief-meters">${meters}</div></section>` +

      `<section class="doc-section"><h2 class="doc-section-title">${U.debriefSections.moments}</h2>` +
      `<ul class="moments">${moments}</ul>` +
      `<div class="doc-actions"><button class="btn" type="button" id="reviewShift">${U.reviewShift || "Read the threads"}</button></div></section>` +

      `<section class="doc-section" id="ruleSection"><h2 class="doc-section-title">${U.debriefSections.rule}</h2>` +
      `<p>${U.ruleIntro}</p>` +
      `<div class="rule-chips" id="ruleChips">${chips}</div>` +
      `<textarea class="rule-text" id="ruleText" placeholder="${U.rulePlaceholder}" maxlength="240"></textarea>` +
      `<div class="doc-actions"><button class="btn btn-primary" type="button" id="ruleRecord" disabled>${U.ruleButton}</button></div>` +
      `</section>` +

      `<section class="doc-section" id="signoffSection" hidden><h2 class="doc-section-title">${U.debriefSections.signoff}</h2>` +
      `<p class="signoff-line">${U.signoff}</p>` +
      `<div class="doc-actions">` +
      `<button class="btn btn-primary" type="button" id="copyProfile">${U.copyProfile}</button>` +
      `<button class="btn" type="button" id="newShift">${U.newShift}</button>` +
      `<button class="btn btn-ghost" type="button" disabled>${U.nextShift}</button>` +
      `</div>` +
      `<p class="copy-status" id="copyStatus" aria-live="polite"></p>` +
      `<p class="closing-line">${U.closingLine}</p></section>` +
      `</div>`;

    $('copyProfile').addEventListener('click', () => copyProfile($('copyStatus'), $('signoffSection')));
    // The moments below quote threads the shift had closed for good (F8).
    $('reviewShift').addEventListener('click', () => {
      const first = CONTENT.cases.find((c) => state.ui.threadHtml[c.id]);
      if (first) openCaseReview(first.id, 'debrief');
    });
    $('newShift').addEventListener('click', beginNewShift);

    logEvent('debrief_shown', { pattern, meters: Object.assign({}, state.meters) });

    const selected = new Set();
    const recordBtn = $('ruleRecord');
    el.querySelectorAll('#ruleChips .chip').forEach((chip) => {
      chip.addEventListener('click', () => {
        const idx = Number(chip.dataset.idx);
        if (selected.has(idx)) selected.delete(idx); else selected.add(idx);
        chip.classList.toggle('is-selected', selected.has(idx));
        recordBtn.disabled = selected.size < 3;
        logEvent('rule_chip', { criterion: D.ruleCriteria[idx], selected: selected.has(idx) });
      });
    });
    recordBtn.addEventListener('click', () => {
      const chosen = [...selected].sort((a, b) => a - b).map((i) => D.ruleCriteria[i]);
      const criteria = chosen.map((c) => c.label);
      const text = $('ruleText').value.trim();
      state.rule = { criteria, text, recordedAt: new Date().toISOString() };
      logEvent('rule_recorded', state.rule);
      const section = $('ruleSection');
      const previous = { selected: [...selected], text };
      const against = chosen.map((c) => {
        const r = ruleCheck(c.id) || {};
        if (r.none) return `<li class="rule-line is-none"><span class="rule-verdict">&mdash;</span>` +
          `<span><strong>${renderMd(c.label)}</strong><br>${renderMd(c.none || "Nothing this shift bore on it.")}</span></li>`;
        const tpl = (r.kept ? c.kept : (r.safety && c.safetyBroke ? c.safetyBroke : c.broke)) || "";
        const line = tpl.replace('{n}', r.n).replace('{m}', r.m);
        return `<li class="rule-line ${r.kept ? 'is-kept' : 'is-broke'}">` +
          `<span class="rule-verdict">${r.kept ? D.ruleKept : D.ruleBroke}</span>` +
          `<span><strong>${renderMd(c.label)}</strong><br>${renderMd(line)}</span></li>`;
      }).join("");
      logEvent('rule_checked', { criteria: chosen.map((c) => ({ id: c.id, result: ruleCheck(c.id) })) });
      state.rule.against = chosen.map((c) => ({ id: c.id, check: ruleCheck(c.id) }));
      section.innerHTML =
        `<h2 class="doc-section-title">${U.debriefSections.rule}</h2>` +
        `<p class="rule-composed">${criteria.map((c) => renderMd(c)).join(" · ")}${text ? `<br><br>${renderMd(text)}` : ""}</p>` +
        `<p class="rule-recorded">${U.ruleRecorded}</p>` +
        `<h3 class="rule-against-title">${D.ruleAgainstTitle}</h3>` +
        `<p class="rule-against-lead">${D.ruleAgainstLead}</p>` +
        `<ul class="rule-against">${against}</ul>` +
        `<div class="doc-actions"><button class="btn btn-ghost" type="button" id="ruleEdit">${U.ruleEdit || "Change it"}</button></div>`;
      // F14: a misclick used to be permanent, on the last screen of the shift.
      $('ruleEdit').addEventListener('click', () => {
        logEvent('rule_edit', {});
        state.rule = null;
        renderDebrief();
        showScreen('screenDebrief');
        const chips = $('ruleChips');
        if (chips) {
          previous.selected.forEach((i) => {
            const chip = chips.querySelector(`.chip[data-idx="${i}"]`);
            if (chip) chip.click();
          });
          $('ruleText').value = previous.text || "";
        }
      });
      const so = $('signoffSection');
      so.hidden = false;
      so.classList.add('reveal');
      showLogLeak(leakText('afterDebrief'));
      persist();
      so.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  }

  // =====================================================================
  // Debug panel (ctrl+shift+d). Jump to any turn with arbitrary flags.
  // =====================================================================
  function renderDebugPanel() {
    const p = $('debugPanel');
    const turnOptions = CONTENT.cases.map((cs, ci) =>
      cs.turns.map((t, ti) => `<option value="${ci}:${ti}"${ci === state.caseIndex && ti === state.turnIndex ? " selected" : ""}>${cs.id} / ${t.id}</option>`).join("")
    ).join("");
    const meterInputs = Object.keys(METER_NAMES).map((k) =>
      `<label>${k}<input type="number" min="0" max="100" id="dbg_${k}" value="${state.meters[k]}"></label>`
    ).join("");
    p.innerHTML =
      `<div class="debug-title">DEBUG · ctrl+shift+d</div>` +
      `<label>Turn<select id="dbgTurn">${turnOptions}</select></label>` +
      `<label>Flags (JSON)<textarea id="dbgFlags">${JSON.stringify(state.flags)}</textarea></label>` +
      `<div class="debug-meters">${meterInputs}</div>` +
      `<div class="debug-actions">` +
      `<button class="btn btn-primary" type="button" id="dbgJump">Jump</button>` +
      `<button class="btn" type="button" id="dbgVignettes">Vignettes</button>` +
      `<button class="btn" type="button" id="dbgDebrief">Debrief</button>` +
      `<button class="btn" type="button" id="dbgExport">Export</button>` +
      `<button class="btn btn-ghost" type="button" id="dbgClose">Close</button>` +
      `</div>` +
      `<div class="debug-flags">case ${state.caseIndex} · turn ${state.turnIndex} · pattern ${computePattern()}</div>`;

    const readMeters = () => {
      const m = {};
      Object.keys(METER_NAMES).forEach((k) => { m[k] = clamp(Number($('dbg_' + k).value) || 0, 0, 100); });
      return m;
    };
    const readFlags = () => {
      try { return JSON.parse($('dbgFlags').value || "{}"); }
      catch (e) { alert("Flags must be valid JSON."); return null; }
    };
    $('dbgJump').addEventListener('click', () => {
      const flags = readFlags();
      if (!flags) return;
      const [ci, ti] = $('dbgTurn').value.split(':').map(Number);
      debugJump(ci, ti, flags, readMeters());
    });
    $('dbgVignettes').addEventListener('click', () => {
      const flags = readFlags();
      if (!flags) return;
      state.flags = flags;
      Object.assign(state.meters, readMeters());
      state.ui.epoch += 1;
      renderMeters();
      // Resolve any missing vignettes from the current flags/case content.
      CONTENT.cases.forEach((cs) => {
        if (state.vignettes[cs.id]) return;
        const closing = cs.turns.find((t) => t.closing);
        if (closing) { const r = closing.resolve(state) || {}; if (r.vignetteKey) state.vignettes[cs.id] = r.vignetteKey; }
      });
      endShift();
      p.hidden = true;
    });
    $('dbgDebrief').addEventListener('click', () => {
      const flags = readFlags();
      if (!flags) return;
      state.flags = flags;
      Object.assign(state.meters, readMeters());
      state.ui.epoch += 1;
      renderMeters();
      renderDebrief();
      showScreen('screenDebrief');
      p.hidden = true;
    });
    $('dbgExport').addEventListener('click', downloadExport);
    $('dbgClose').addEventListener('click', () => { p.hidden = true; });
  }

  function debugJump(caseIdx, turnIdx, flags, meters) {
    state.ui.epoch += 1;
    hideScreens();
    setMusicLevel(MUSIC.console, TIMING.MUSIC_DUCK_MS);
    finishBoot(true);
    state.flags = flags;
    Object.assign(state.meters, meters);
    state.caseIndex = caseIdx;
    state.turnIndex = turnIdx;
    const cs = currentCase();
    CONTENT.cases.forEach((c, i) => {
      if (i < caseIdx && !state.ui.caseStatus[c.id]) state.ui.caseStatus[c.id] = "released";
    });
    state.ui.caseStatus[cs.id] = "active";
    state.ui.queueVisible = Math.max(state.ui.queueVisible, caseIdx + 1);
    scheduleQueueGrowth();
    ensureAssess(cs.id);
    state.ui.riskTag = null;
    state.ui.issueTag = null;
    state.ui.tagsFrozen = false;
    state.ui.draftBlock = null;
    state.ui.lastKind = null;
    state.ui.shiftEnded = false;
    renderMeters();
    renderQueue();
    $('threadMessages').innerHTML = "";
    $('threadControls').hidden = false;
    logEvent('debug_jump', { caseId: cs.id, turnId: cs.turns[turnIdx].id, flags: Object.assign({}, flags), meters: Object.assign({}, meters) });
    $('debugPanel').hidden = true;
    startTurn();
  }

  function toggleDebugPanel() {
    const p = $('debugPanel');
    if (p.hidden) { renderDebugPanel(); p.hidden = false; }
    else p.hidden = true;
  }

  // Playtest hooks. Used by the headless smoke harness and handy from the
  // console. Not part of the player-facing UI.
  window.__oracleDebug = {
    state,
    TIMING,
    jump: debugJump,
    pattern: computePattern,
    fast(scale) {
      const s = scale == null ? 0.1 : scale;
      const keep = new Set(['HESITATION_MS', 'QUEUE_GROW_MS']); // tested explicitly
      Object.keys(TIMING).forEach((k) => { if (!keep.has(k)) TIMING[k] = Math.max(10, Math.round(TIMING[k] * s)); });
      document.documentElement.style.setProperty('--t-hold', TIMING.HOLD_MS + 'ms');
    },
    skipStream() { if (state.ui.finishStream) state.ui.finishStream(); },
    skipBoot() { finishBoot(); },
    tint() { return $('oracleGlyph').dataset.tint || 'balanced'; },
    music() {
      return {
        available: music.available, on: music.on,
        level: +music.level.toFixed(3), context: music.context,
        playing: music.els.map((a) => !a.paused),
        volumes: music.els.map((a) => +a.volume.toFixed(3))
      };
    },
    toggleSound,
    openOracle, closeOracle,
    musicSeek(t) { const a = music.els[music.i]; if (a.duration) a.currentTime = Math.min(t, a.duration - 0.05); },
    glyphClasses() { return $('oracleGlyph').className; },
    queueCount() { return $('queueList').children.length; },
    leaks() { return [...state.ui.leaksFired]; },
    growQueue,
    hesitate() {
      // Fire the hesitation line now without changing the timer for later turns.
      disarmHesitation(); state.ui.hesitationFired = false;
      const prev = TIMING.HESITATION_MS; TIMING.HESITATION_MS = 30; armHesitation(); TIMING.HESITATION_MS = prev;
    },
    tag(risk, issue) {
      const rw = $('tagRisk'), iw = $('tagIssue');
      const turn = currentTurn();
      if (risk) selectTag('risk', risk, rw);
      if (issue) selectTag('issue', issue, iw);
      // mirror the visual selection
      if (turn && turn.tags) {
        Array.from(rw.children).forEach((c, i) => c.classList.toggle('is-selected', turn.tags.risk[i] === risk));
        Array.from(iw.children).forEach((c, i) => c.classList.toggle('is-selected', state.ui.issueOptions[i] === issue));
      }
    },
    choose(kind) { if (kind === 'continue') onContinue(); else chooseIntervention(kind); },
    option(idx) {
      const btns = Array.from($('subPanel').querySelectorAll('.btn-option'));
      const b = btns[idx || 0];
      if (!b || b.disabled) return false;
      b.click();
      return true;
    },
    confirmHandoff() { const b = Array.from($('subPanel').querySelectorAll('.btn')).find((x) => x.textContent === 'Confirm handoff'); if (b) b.click(); },
    openEvidence(key) { openEvidence(key); },
    // Resolves when the console is unlocked on the given turn (or any turn).
    waitTurn(turnId, timeoutMs) {
      const deadline = Date.now() + (timeoutMs || 60000);
      return new Promise((resolve, reject) => {
        const tick = () => {
          if (!bootDone) finishBoot();
          const t = currentTurn();
          if (state.ui.finishStream) state.ui.finishStream();
          if (!state.ui.locked && t && (!turnId || t.id === turnId)) return resolve(t.id);
          if (Date.now() > deadline) return reject(new Error('timeout waiting for ' + (turnId || 'any turn') + ' (at ' + (t && t.id) + ', locked=' + state.ui.locked + ')'));
          setTimeout(tick, 40);
        };
        tick();
      });
    },
    waitScreen(id, timeoutMs) {
      const deadline = Date.now() + (timeoutMs || 60000);
      return new Promise((resolve, reject) => {
        const tick = () => {
          if (!$(id).hidden) return resolve(id);
          if (Date.now() > deadline) return reject(new Error('timeout waiting for ' + id));
          setTimeout(tick, 40);
        };
        tick();
      });
    },
    threadText() { return Array.from($('threadMessages').children).map((el) => el.textContent.trim()).join('\n'); },
    logText() { return $('logText').textContent; },
    oracleLine() { return $('oracleMargin').textContent; },
    buttons() { return Array.from($('interventionRow').querySelectorAll('.btn')).map((b) => b.dataset.kind); },
    chips() { return Array.from($('tagIssue').children).map((c) => c.textContent); },
    evidenceKeys() { return Array.from($('evidenceList').querySelectorAll('.evidence-section')).map((s) => s.dataset.key); }
  };

  // =====================================================================
  // Keyboard
  // =====================================================================
  document.addEventListener('keydown', (e) => {
    if (e.ctrlKey && e.shiftKey && (e.key === 'E' || e.key === 'e')) {
      e.preventDefault();
      downloadExport();
      return;
    }
    if (e.ctrlKey && e.shiftKey && (e.key === 'D' || e.key === 'd')) {
      e.preventDefault();
      toggleDebugPanel();
      return;
    }
    if ((e.key === 'm' || e.key === 'M') && !e.ctrlKey && !e.metaKey && !e.altKey) {
      const t = e.target;
      const typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable);
      if (!typing) { e.preventDefault(); toggleSound(); return; }
    }
    if (e.key === 'Escape') {
      if (!$('supportPanel').hidden) { closeSupport(); return; }
      if (!$('oraclePanel').hidden) { closeOracle(); return; }
      if (state.ui.reviewingCaseId) { closeCaseReview(); return; }
      if (!$('debugPanel').hidden) { $('debugPanel').hidden = true; return; }
      const p = $('subPanel');
      if (!p.hidden && !state.ui.locked && subPanelOptions && subPanelOptions.kind !== 'verify') clearSubPanel();
      else if (!p.hidden && !state.ui.locked && !subPanelOptions) clearSubPanel();
      $('evidenceList').querySelectorAll('.evidence-toggle[aria-expanded="true"]').forEach((btn) => {
        toggleEvidence(btn.parentElement.dataset.key, btn);
      });
    }
  });

  // =====================================================================
  // Boot sequence: pipeline log → review layer attached → session ID.
  // Skippable. The first leak lives in the boot log.
  // =====================================================================
  let bootDone = false;
  let bootTimer = null;

  function bootLineEl(raw) {
    sfx('boot');
    const div = document.createElement('div');
    div.className = "boot-line";
    const m = /^\{leak:(\w+)\}$/.exec(raw);
    if (m) { div.classList.add('is-leak'); div.textContent = leakText(m[1]); logEvent('leak', { text: div.textContent, boot: true }); state.ui.leaksFired.add(div.textContent); }
    else div.textContent = raw.replace(/\{session\}/g, state.session);
    return div;
  }

  function runBoot() {
    const lines = CONTENT.boot || [];
    const log = $('bootLog');
    $('bootSkip').textContent = CONTENT.bootSkip || "Skip";
    $('bootNote').textContent = CONTENT.ui.contentNote || "";
    $('bootSkip').addEventListener('click', () => { logEvent('boot_skip', {}); finishBoot(); });
    logEvent('boot_start', {});
    let i = 0;
    const step = () => {
      if (bootDone) return;
      if (i < lines.length) {
        const el = bootLineEl(lines[i]);
        if (i === lines.length - 1) el.classList.add('is-final');
        log.appendChild(el);
        i += 1;
        bootTimer = setTimeout(step, TIMING.BOOT_LINE_MS);
      } else {
        bootTimer = setTimeout(() => finishBoot(), TIMING.BOOT_HOLD_MS);
      }
    };
    step();
  }

  function finishBoot(immediate) {
    if (bootDone) return;
    bootDone = true;
    if (bootTimer) { clearTimeout(bootTimer); bootTimer = null; }
    // Any boot leak not yet shown still counts as fired: once per shift.
    (CONTENT.boot || []).forEach((raw) => { const m = /^\{leak:(\w+)\}$/.exec(raw); if (m) state.ui.leaksFired.add(leakText(m[1])); });
    const b = $('screenBoot');
    logEvent('boot_end', {});
    if (immediate) { b.remove(); return; }
    b.classList.add('is-fading');
    setTimeout(() => b.remove(), TIMING.BOOT_FADE_MS + 50);
    setMusicLevel(MUSIC.console, TIMING.MUSIC_FADE_MS);
    startCase();
  }

  function boot() {
    const root = document.documentElement.style;
    root.setProperty('--t-slide', TIMING.SLIDE_MS + 'ms');
    root.setProperty('--t-hold', TIMING.HOLD_MS + 'ms');
    root.setProperty('--t-meter', TIMING.METER_ANIM_MS + 'ms');
    root.setProperty('--t-tint', TIMING.TINT_MS + 'ms');
    root.setProperty('--t-glyph-idle', TIMING.GLYPH_IDLE_MS + 'ms');
    root.setProperty('--t-glyph-draft', TIMING.GLYPH_DRAFT_MS + 'ms');
    root.setProperty('--t-glyph-flash', TIMING.GLYPH_FLASH_MS + 'ms');
    root.setProperty('--t-boot-fade', TIMING.BOOT_FADE_MS + 'ms');

    if (typeof CONTENT === 'undefined') {
      $('logText').textContent = "content.js not loaded";
      $('screenBoot').remove();
      return;
    }
    initSession();
    $('sessionId').textContent = "session " + state.session;
    renderSupportPanel();
    musicInit();
    $('soundBtn').addEventListener('click', toggleSound);
    $('oracleGlyph').addEventListener('click', openOracle);
    setMusicLevel(MUSIC.screen, TIMING.MUSIC_FADE_MS);
    renderMeters();
    renderQueue();
    watchConsoleHeight();
    watchDock();
    setTimeout(cycleLogLine, 1500);
    $('threadEmpty').remove();
    logEvent('session_start', { session: state.session, replay: state.replay });
    runBoot();
  }

  boot();
})();
</script>
</body>
</html>
